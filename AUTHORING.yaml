      status: alpha
      runtime_verification: pending
    quiz: sections/section-040/module-02/quiz.yaml
  - id: module-03
    title: Patch Nodes And Verify The Upgraded Cluster
    objectives:
    - Patch the operating system, kernel and container runtime of a node one node
      at a time.
    - Verify a cluster in layers after maintenance and repair a node left cordoned
      or tainted.
    - Decide between fixing forward and restoring etcd, and prove a restore with a
      drill.
    outline:
    - Patch The Operating System And Container Runtime On Nodes
    - Verify The Cluster After An Upgrade
    - Rollback Limits And Restore Drills
