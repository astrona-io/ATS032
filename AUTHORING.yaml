      after_reading: sections/section-040/module-01/course-02-cordon-drain-and-disruption-budgets.md
      objective: Respect disruption limits while draining and returning an isolated
        worker to service.
      status: alpha
      runtime_verification: pending
    quiz: sections/section-040/module-01/quiz.yaml
  - id: module-02
    title: Track Vulnerabilities And Inventory Versions
    objectives:
    - Name the sources that publish Kubernetes vulnerabilities and read a CVSS score
      and a patch release.
    - Read the versions of nodes, the API server, the container runtime and the images
      that a cluster runs.
    - Triage a vulnerability against the inventory and group nodes into patch waves.
    outline:
    - Where Vulnerabilities Are Published
    - Inventory What The Cluster Runs
    - Triage A Vulnerability And Plan Patch Waves
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-02/course-01-where-vulnerabilities-are-published.md
