apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-040-01-01
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-032-040-01-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-032-040-01-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: probe
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: probe
  namespace: starfleet-032-040-01-01
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: probe
