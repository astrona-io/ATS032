apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-01-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pdb-allows-disruption
    description: Every PodDisruptionBudget that selects the probe Pods allows at least one disruption
    type: file
    source: validation/validate-pdb-allows-disruption.sh
    points: 1
  - name: bare-pod-preserved
    description: The bare Pod drifter runs again, unchanged, on the control plane node
    type: file
    source: validation/validate-bare-pod-preserved.sh
    points: 1
  - name: worker-drained
    description: The worker is cordoned, only DaemonSet Pods remain on it and two probe Pods are available
    type: file
    source: validation/validate-worker-drained.sh
    points: 1
