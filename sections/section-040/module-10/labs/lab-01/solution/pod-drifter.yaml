apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-032-040-01-01
  labels:
    app: drifter
spec:
  nodeSelector:
    kubernetes.io/hostname: CONTROL_PLANE_NAME
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
