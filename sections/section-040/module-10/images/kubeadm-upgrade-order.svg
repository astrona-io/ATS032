<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Order of a kubeadm upgrade</title>
  <desc id="desc">First take an etcd snapshot. Then run kubeadm upgrade apply on the first control-plane node, kubeadm upgrade node on every other control-plane node, and kubeadm upgrade node on each worker, one at a time. Every node is drained, gets the new kubelet and kubectl, and is uncordoned. Last, verify the nodes and the API health.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M240 86 V112" marker-end="url(#arrow)"/>
  <path class="line" d="M240 174 V200" marker-end="url(#arrow)"/>
  <path class="line" d="M240 262 V318" marker-end="url(#arrow)"/>
  <path class="line" d="M240 380 V406" marker-end="url(#arrow)"/>

  <rect class="frame" x="20" y="100" width="800" height="186" rx="10"/>
  <text class="label" x="804" y="122" text-anchor="end">control plane first</text>
  <rect class="frame" x="20" y="306" width="800" height="86" rx="10"/>
  <text class="label" x="804" y="328" text-anchor="end">workers</text>

  <rect class="ask" x="60" y="30" width="360" height="56" rx="8"/>
  <text x="240" y="63" text-anchor="middle" class="strong">Snapshot etcd</text>
  <text x="450" y="63">The way back if the upgrade fails.</text>

  <rect class="box" x="60" y="114" width="360" height="60" rx="8"/>
  <text x="240" y="138" text-anchor="middle" class="strong">First control-plane node</text>
  <text class="code" x="240" y="160" text-anchor="middle">kubeadm upgrade apply</text>
  <text x="450" y="138">Upgrades the control plane and</text>
  <text x="450" y="158">stores the new cluster configuration.</text>
  <text x="450" y="178">Then drain, kubelet, uncordon.</text>

  <rect class="box" x="60" y="202" width="360" height="60" rx="8"/>
  <text x="240" y="226" text-anchor="middle" class="strong">Other control-plane nodes</text>
  <text class="code" x="240" y="248" text-anchor="middle">kubeadm upgrade node</text>
  <text x="450" y="226">Read the stored configuration and</text>
  <text x="450" y="246">upgrade their own static Pods.</text>
  <text x="450" y="266">Then drain, kubelet, uncordon.</text>

  <rect class="box" x="60" y="320" width="360" height="60" rx="8"/>
  <text x="240" y="344" text-anchor="middle" class="strong">Each worker, one at a time</text>
  <text class="code" x="240" y="366" text-anchor="middle">kubeadm upgrade node</text>
  <text x="450" y="344">Updates the kubelet configuration.</text>
  <text x="450" y="364">Then drain, kubelet, uncordon.</text>

  <rect class="ok" x="60" y="408" width="360" height="50" rx="8"/>
  <text x="240" y="438" text-anchor="middle" class="strong">Verify nodes and API health</text>
</svg>
