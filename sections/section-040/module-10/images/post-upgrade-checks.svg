<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Checks after an upgrade</title>
  <desc id="desc">Five checks after an upgrade: kubectl get nodes shows the node Ready at the target version, /readyz?verbose shows every API server health check ok, a field selector lists Pods that are not Running, kubeadm certs check-expiration shows the certificate dates, and a curl request to the probe Service proves that the application answers.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M220 84 V96" marker-end="url(#arrow)"/>
  <path class="line" d="M220 148 V160" marker-end="url(#arrow)"/>
  <path class="line" d="M220 212 V224" marker-end="url(#arrow)"/>
  <path class="line" d="M220 276 V288" marker-end="url(#arrow)"/>

  <text class="strong" x="30" y="24">Command</text>
  <text class="strong" x="460" y="24">What a good result proves</text>

  <rect class="box" x="30" y="36" width="380" height="48" rx="8"/>
  <text class="code" x="220" y="65" text-anchor="middle">kubectl get nodes</text>
  <text x="460" y="65">Every node is <tspan class="code">Ready</tspan> at <tspan class="code">v1.36.6</tspan>.</text>

  <rect class="box" x="30" y="100" width="380" height="48" rx="8"/>
  <text class="code" x="220" y="129" text-anchor="middle">kubectl get --raw='/readyz?verbose'</text>
  <text x="460" y="129">Every API server health check is <tspan class="code">ok</tspan>.</text>

  <rect class="box" x="30" y="164" width="380" height="48" rx="8"/>
  <text class="code" x="220" y="193" text-anchor="middle">--field-selector=status.phase!=Running</text>
  <text x="460" y="193">No Pod is outside the <tspan class="code">Running</tspan> phase.</text>

  <rect class="box" x="30" y="228" width="380" height="48" rx="8"/>
  <text class="code" x="220" y="257" text-anchor="middle">kubeadm certs check-expiration</text>
  <text x="460" y="257">The certificates run for one more year.</text>

  <rect class="ok" x="30" y="292" width="380" height="48" rx="8"/>
  <text class="code" x="220" y="321" text-anchor="middle">curl http://&lt;probe ClusterIP&gt;/</text>
  <text x="460" y="321">A <tspan class="code">probe</tspan> Pod answers through the Service.</text>

  <text class="label" x="30" y="368">From the platform at the top to the application at the bottom.</text>
</svg>
