<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Which minor versions receive fixes</title>
  <desc id="desc">The Kubernetes project keeps release branches for the most recent three minor versions. The newest minor version and the two before it receive patch releases with bug and security fixes. Older minor versions receive no fixes, even for a published vulnerability.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M30 200 H800" marker-end="url(#arrow)"/>
  <text class="label" x="800" y="225" text-anchor="end">newer releases</text>

  <rect class="policy" x="340" y="34" width="470" height="146" rx="10"/>
  <text class="label" x="575" y="56" text-anchor="middle">release branches: the most recent three minor versions</text>

  <rect class="drop" x="40" y="80" width="130" height="80" rx="8"/>
  <text x="105" y="112" text-anchor="middle" class="strong">newest − 4</text>
  <text x="105" y="136" text-anchor="middle" class="bad">no fixes</text>

  <rect class="drop" x="190" y="80" width="130" height="80" rx="8"/>
  <text x="255" y="112" text-anchor="middle" class="strong">newest − 3</text>
  <text x="255" y="136" text-anchor="middle" class="bad">no fixes</text>

  <rect class="ok" x="360" y="80" width="130" height="80" rx="8"/>
  <text x="425" y="112" text-anchor="middle" class="strong">newest − 2</text>
  <text x="425" y="136" text-anchor="middle" class="good">patches</text>

  <rect class="ok" x="510" y="80" width="130" height="80" rx="8"/>
  <text x="575" y="112" text-anchor="middle" class="strong">newest − 1</text>
  <text x="575" y="136" text-anchor="middle" class="good">patches</text>

  <rect class="ok" x="660" y="80" width="130" height="80" rx="8"/>
  <text x="725" y="112" text-anchor="middle" class="strong">newest minor</text>
  <text x="725" y="136" text-anchor="middle" class="good">patches</text>

  <text class="label" x="30" y="225">minor versions, oldest on the left</text>
</svg>
