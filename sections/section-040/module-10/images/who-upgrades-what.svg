<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Who upgrades what in a kubeadm upgrade</title>
  <desc id="desc">The package manager apt installs the new kubeadm, kubelet and kubectl packages on each host. kubeadm upgrade apply changes the static Pods of kube-apiserver, kube-controller-manager, kube-scheduler and etcd, and the kube-proxy and CoreDNS add-ons.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M200 104 V138" marker-end="url(#arrow)"/>
  <path class="line" d="M620 104 V138" marker-end="url(#arrow)"/>

  <text class="strong" x="200" y="34" text-anchor="middle">On the host</text>
  <text class="strong" x="620" y="34" text-anchor="middle">In the cluster</text>

  <rect class="box" x="60" y="50" width="280" height="54" rx="8"/>
  <text x="200" y="74" text-anchor="middle">package manager</text>
  <text class="code" x="200" y="94" text-anchor="middle">apt-get install</text>

  <rect class="ask" x="480" y="50" width="280" height="54" rx="8"/>
  <text class="code" x="620" y="82" text-anchor="middle">kubeadm upgrade apply</text>

  <rect class="frame" x="40" y="140" width="320" height="170" rx="10"/>
  <text class="label" x="200" y="162" text-anchor="middle">packages, upgraded on each node</text>
  <rect class="ok" x="80" y="176" width="240" height="34" rx="6"/>
  <text class="code" x="200" y="198" text-anchor="middle">kubeadm</text>
  <rect class="ok" x="80" y="218" width="240" height="34" rx="6"/>
  <text class="code" x="200" y="240" text-anchor="middle">kubelet</text>
  <rect class="ok" x="80" y="260" width="240" height="34" rx="6"/>
  <text class="code" x="200" y="282" text-anchor="middle">kubectl</text>

  <rect class="frame" x="430" y="140" width="380" height="170" rx="10"/>
  <text class="label" x="620" y="162" text-anchor="middle">static Pods in /etc/kubernetes/manifests</text>
  <rect class="ok" x="450" y="176" width="340" height="60" rx="6"/>
  <text class="code" x="620" y="198" text-anchor="middle">kube-apiserver · etcd</text>
  <text class="code" x="620" y="222" text-anchor="middle">kube-controller-manager · kube-scheduler</text>
  <text class="label" x="620" y="258" text-anchor="middle">add-ons</text>
  <rect class="ok" x="450" y="266" width="340" height="34" rx="6"/>
  <text class="code" x="620" y="288" text-anchor="middle">kube-proxy · CoreDNS</text>
</svg>
