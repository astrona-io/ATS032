<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Version skew rules for a cluster at 1.35</title>
  <desc id="desc">With kube-apiserver at 1.35, kubectl may run 1.34, 1.35 or 1.36. kube-controller-manager and kube-scheduler may run 1.34 or 1.35. The kubelet and kube-proxy may run 1.32 to 1.35. Only kubectl may be newer than the API server.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="policy" d="M650 46 V330" fill="none"/>
  <text class="label" x="350" y="36" text-anchor="middle">1.32</text>
  <text class="label" x="450" y="36" text-anchor="middle">1.33</text>
  <text class="label" x="550" y="36" text-anchor="middle">1.34</text>
  <text class="label" x="650" y="36" text-anchor="middle">1.35</text>
  <text class="label" x="750" y="36" text-anchor="middle">1.36</text>
  <line class="sep" x1="30" y1="104" x2="810" y2="104"/>
  <line class="sep" x1="30" y1="160" x2="810" y2="160"/>
  <line class="sep" x1="30" y1="216" x2="810" y2="216"/>
  <line class="sep" x1="30" y1="272" x2="810" y2="272"/>

  <text class="code" x="30" y="81">kube-apiserver</text>
  <rect class="ask" x="610" y="60" width="80" height="32" rx="6"/>
  <text x="650" y="81" text-anchor="middle" class="strong">1.35</text>

  <text class="code" x="30" y="129">kube-controller-manager</text>
  <text class="code" x="30" y="147">kube-scheduler</text>
  <rect class="ok" x="510" y="116" width="180" height="32" rx="6"/>
  <text x="600" y="137" text-anchor="middle">same or 1 older</text>
  <rect class="drop" x="710" y="116" width="80" height="32" rx="6" stroke-dasharray="6 5"/>
  <text x="750" y="137" text-anchor="middle" class="bad">newer</text>

  <text class="code" x="30" y="193">kubelet</text>
  <rect class="ok" x="310" y="172" width="380" height="32" rx="6"/>
  <text x="500" y="193" text-anchor="middle">same or up to 3 older</text>
  <rect class="drop" x="710" y="172" width="80" height="32" rx="6" stroke-dasharray="6 5"/>
  <text x="750" y="193" text-anchor="middle" class="bad">newer</text>

  <text class="code" x="30" y="249">kube-proxy</text>
  <rect class="ok" x="310" y="228" width="380" height="32" rx="6"/>
  <text x="500" y="249" text-anchor="middle">same or up to 3 older</text>
  <rect class="drop" x="710" y="228" width="80" height="32" rx="6" stroke-dasharray="6 5"/>
  <text x="750" y="249" text-anchor="middle" class="bad">newer</text>

  <text class="code" x="30" y="305">kubectl</text>
  <rect class="ok" x="510" y="284" width="280" height="32" rx="6"/>
  <text x="650" y="305" text-anchor="middle">1 older, same or 1 newer</text>

  <text class="label" x="30" y="350">The amber line is the version of the API server. Nothing but kubectl may sit to its right.</text>
</svg>
