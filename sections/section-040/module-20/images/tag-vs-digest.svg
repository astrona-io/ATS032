<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">A tag can move, a digest cannot</title>
  <desc id="desc">The registry first points the tag python:3.13-alpine at one image. After a rebuild with a security fix it points the same tag at a new image with a new digest. A node that pulled the tag before the rebuild and a node that pulled it after run different code under the same name. A reference written as name@sha256:digest always names one image.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M230 112 C280 112 280 72 328 72" marker-end="url(#arrow)"/>
  <path class="line" d="M230 112 C280 112 280 152 328 152" marker-end="url(#arrow)"/>
  <path class="line" d="M550 72 H618" marker-end="url(#arrow)"/>
  <path class="line" d="M550 152 H618" marker-end="url(#arrow)"/>
  <path class="okline" d="M230 290 H328" marker-end="url(#arrowok)"/>

  <text class="label" x="280" y="40" text-anchor="middle">the tag moves</text>
  <text class="label" x="584" y="64" text-anchor="middle">pulled</text>
  <text class="label" x="584" y="144" text-anchor="middle">pulled</text>

  <rect class="ask" x="30" y="90" width="200" height="44" rx="8"/>
  <text class="code" x="130" y="117" text-anchor="middle">python:3.13-alpine</text>

  <rect class="box" x="330" y="50" width="220" height="44" rx="8"/>
  <text x="440" y="77" text-anchor="middle">Image before the rebuild</text>
  <rect class="box" x="330" y="130" width="220" height="44" rx="8"/>
  <text x="440" y="157" text-anchor="middle">Image with the fix</text>

  <rect class="frame" x="620" y="50" width="190" height="44" rx="8"/>
  <text x="715" y="77" text-anchor="middle">Node pulled day 1</text>
  <rect class="frame" x="620" y="130" width="190" height="44" rx="8"/>
  <text x="715" y="157" text-anchor="middle">Node pulled day 2</text>

  <text x="30" y="212">Same tag on both nodes, different digest, different code.</text>
  <line class="sep" x1="30" y1="236" x2="810" y2="236"/>

  <rect class="ok" x="30" y="268" width="200" height="44" rx="8"/>
  <text class="code" x="130" y="295" text-anchor="middle">name@sha256:&lt;digest&gt;</text>
  <rect class="box" x="330" y="268" width="220" height="44" rx="8"/>
  <text x="440" y="295" text-anchor="middle">Always the same image</text>
  <text x="570" y="286">Reproducible, but a fix needs</text>
  <text x="570" y="308">a new digest, set on purpose</text>
</svg>
