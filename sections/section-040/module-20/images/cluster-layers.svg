<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">The layers of a version inventory</title>
  <desc id="desc">Each layer of a cluster is patched separately and has its own place to read the version. The control plane versions come from the images in kube-system and from the /version endpoint. The kubelet and container runtime come from status.nodeInfo. The operating system and kernel also come from status.nodeInfo. Workload and add-on images come from the Pod specifications, and the exact content from the imageID in the container status.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M480 82 H528" marker-end="url(#arrow)"/>
  <path class="line" d="M480 164 H528" marker-end="url(#arrow)"/>
  <path class="line" d="M480 236 H528" marker-end="url(#arrow)"/>
  <path class="line" d="M480 308 H528" marker-end="url(#arrow)"/>

  <text class="label" x="30" y="30">Layer</text>
  <text class="label" x="530" y="30">Where to read the version</text>

  <rect class="box" x="30" y="44" width="450" height="76" rx="8"/>
  <text class="strong" x="46" y="66">Control plane</text>
  <text class="code" x="46" y="88">kube-apiserver, kube-scheduler,</text>
  <text class="code" x="46" y="108">kube-controller-manager, etcd</text>
  <rect class="ask" x="530" y="44" width="280" height="76" rx="8"/>
  <text class="code" x="546" y="76">kubectl get --raw /version</text>
  <text x="546" y="98">image tags in <tspan class="code">kube-system</tspan></text>

  <rect class="box" x="30" y="136" width="450" height="56" rx="8"/>
  <text class="strong" x="46" y="158">Node components, on every node</text>
  <text x="46" y="180"><tspan class="code">kubelet</tspan>, container runtime, <tspan class="code">kube-proxy</tspan></text>
  <rect class="ask" x="530" y="136" width="280" height="56" rx="8"/>
  <text class="code" x="546" y="158">status.nodeInfo</text>
  <text x="546" y="180"><tspan class="code">kube-proxy</tspan> image tag</text>

  <rect class="box" x="30" y="208" width="450" height="56" rx="8"/>
  <text class="strong" x="46" y="230">The node itself</text>
  <text x="46" y="252">Operating system and kernel</text>
  <rect class="ask" x="530" y="208" width="280" height="56" rx="8"/>
  <text class="code" x="546" y="230">status.nodeInfo</text>
  <text class="code" x="546" y="252">osImage, kernelVersion</text>

  <rect class="box" x="30" y="280" width="450" height="56" rx="8"/>
  <text class="strong" x="46" y="302">Workloads and add-ons</text>
  <text x="46" y="324">Application images, CoreDNS, the network plugin</text>
  <rect class="ask" x="530" y="280" width="280" height="56" rx="8"/>
  <text x="546" y="302">Pod spec images</text>
  <text x="546" y="324"><tspan class="code">imageID</tspan> for the digest</text>
</svg>
