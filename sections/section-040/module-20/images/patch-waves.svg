<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Patch waves in the playground</title>
  <desc id="desc">Wave 1 is the control-plane node, which goes first because kubelets may not be newer than the API server. Wave 2 is the first worker, which runs only Pods that a controller recreates. Wave 3 is the second worker, which runs the bare Pods shuttle and drifter that a drain refuses. Each node carries a patch-wave label with its wave number.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M270 140 H298" marker-end="url(#arrow)"/>
  <path class="line" d="M540 140 H568" marker-end="url(#arrow)"/>

  <rect class="frame" x="30" y="40" width="240" height="250" rx="10"/>
  <text class="label" x="46" y="64">Node <tspan class="code">-control-plane</tspan></text>
  <rect class="frame" x="300" y="40" width="240" height="250" rx="10"/>
  <text class="label" x="316" y="64">Node <tspan class="code">-worker</tspan></text>
  <rect class="frame" x="570" y="40" width="240" height="250" rx="10"/>
  <text class="label" x="586" y="64">Node <tspan class="code">-worker2</tspan></text>

  <rect class="ask" x="50" y="80" width="200" height="36" rx="8"/>
  <text class="code" x="150" y="103" text-anchor="middle">patch-wave=1</text>
  <rect class="ask" x="320" y="80" width="200" height="36" rx="8"/>
  <text class="code" x="420" y="103" text-anchor="middle">patch-wave=2</text>
  <rect class="ask" x="590" y="80" width="200" height="36" rx="8"/>
  <text class="code" x="690" y="103" text-anchor="middle">patch-wave=3</text>

  <rect class="box" x="50" y="140" width="200" height="56" rx="8"/>
  <text x="150" y="163" text-anchor="middle">Static Pods of</text>
  <text x="150" y="184" text-anchor="middle">the control plane</text>
  <rect class="ok" x="320" y="140" width="200" height="56" rx="8"/>
  <text x="420" y="163" text-anchor="middle">Only Pods that a</text>
  <text x="420" y="184" text-anchor="middle">controller recreates</text>
  <rect class="drop" x="590" y="140" width="95" height="56" rx="8"/>
  <text class="code" x="637" y="173" text-anchor="middle">shuttle</text>
  <rect class="drop" x="695" y="140" width="95" height="56" rx="8"/>
  <text class="code" x="742" y="173" text-anchor="middle">drifter</text>

  <text x="150" y="232" text-anchor="middle">First: kubelets may not be</text>
  <text x="150" y="254" text-anchor="middle">newer than the API server</text>
  <text x="420" y="232" text-anchor="middle">Easy to drain: a controller</text>
  <text x="420" y="254" text-anchor="middle">recreates every Pod</text>
  <text x="690" y="232" text-anchor="middle">Last: bare Pods,</text>
  <text x="690" y="254" text-anchor="middle">a drain refuses them</text>
</svg>
