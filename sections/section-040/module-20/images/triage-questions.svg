<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="title desc">
  <title id="title">The five triage questions</title>
  <desc id="desc">Ask five questions in order. If the cluster does not run an affected version, stop and note the finding as not affected. If the vulnerable feature is not in use, the cluster is not exposed. Then ask whether an attacker can reach it, what the attacker gains and whether a fix or a workaround exists. The answers give a priority and a written reason.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M240 94 V114" marker-end="url(#arrow)"/>
  <path class="line" d="M240 160 V180" marker-end="url(#arrow)"/>
  <path class="line" d="M240 226 V246" marker-end="url(#arrow)"/>
  <path class="line" d="M240 292 V312" marker-end="url(#arrow)"/>
  <path class="okline" d="M240 358 V412" marker-end="url(#arrowok)"/>
  <path class="line" d="M450 72 H538" marker-end="url(#arrow)"/>
  <path class="line" d="M450 138 H538" marker-end="url(#arrow)"/>

  <text class="label" x="252" y="108">yes</text>
  <text class="label" x="252" y="174">yes</text>
  <text class="label" x="494" y="64" text-anchor="middle">no</text>
  <text class="label" x="494" y="130" text-anchor="middle">no</text>

  <rect class="ask" x="30" y="50" width="420" height="44" rx="8"/>
  <text x="46" y="77">1. Does the cluster run an affected version?</text>
  <rect class="ask" x="30" y="116" width="420" height="44" rx="8"/>
  <text x="46" y="143">2. Is the vulnerable feature in use?</text>
  <rect class="ask" x="30" y="182" width="420" height="44" rx="8"/>
  <text x="46" y="209">3. Can an attacker reach it?</text>
  <rect class="ask" x="30" y="248" width="420" height="44" rx="8"/>
  <text x="46" y="275">4. What does an attacker gain?</text>
  <rect class="ask" x="30" y="314" width="420" height="44" rx="8"/>
  <text x="46" y="341">5. Is a fix or a workaround available?</text>

  <rect class="box" x="540" y="50" width="270" height="44" rx="8"/>
  <text x="675" y="77" text-anchor="middle">Stop: note as not affected</text>
  <rect class="box" x="540" y="116" width="270" height="44" rx="8"/>
  <text x="675" y="143" text-anchor="middle">Not exposed: lower priority</text>

  <text class="label" x="470" y="215">Read the attack vector</text>
  <text class="label" x="470" y="281">Disclosure, denial of service,</text>
  <text class="label" x="470" y="299">privilege escalation, node control</text>
  <text class="label" x="470" y="347">Patch release or a mitigation</text>

  <rect class="ok" x="30" y="414" width="420" height="44" rx="8"/>
  <text class="strong" x="240" y="441" text-anchor="middle">Priority and a written reason</text>
</svg>
