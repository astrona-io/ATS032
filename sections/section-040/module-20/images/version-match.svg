<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Match the server version against a CVE record</title>
  <desc id="desc">A CVE record says the fix is in v1.35.2 and v1.34.5. A cluster on v1.35.0 is affected and a patch upgrade to v1.35.2 or newer fixes it. A cluster on v1.35.2 already has the fix. A cluster on v1.33.9 is affected and must first move to a version in the fixed list.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M420 94 V130"/>
  <path class="line" d="M140 130 H700"/>
  <path class="line" d="M140 130 V158" marker-end="url(#arrow)"/>
  <path class="line" d="M420 130 V158" marker-end="url(#arrow)"/>
  <path class="line" d="M700 130 V158" marker-end="url(#arrow)"/>
  <path class="dashed" d="M140 204 V238" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M420 204 V238" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M700 204 V238" marker-end="url(#arrowbad)"/>

  <rect class="ask" x="230" y="40" width="380" height="54" rx="8"/>
  <text class="strong" x="420" y="62" text-anchor="middle">CVE record</text>
  <text x="420" y="83" text-anchor="middle">fixed in <tspan class="code">v1.35.2</tspan> and <tspan class="code">v1.34.5</tspan></text>

  <rect class="box" x="40" y="160" width="200" height="44" rx="8"/>
  <text x="140" y="187" text-anchor="middle"><tspan class="code">gitVersion: v1.35.0</tspan></text>
  <rect class="box" x="320" y="160" width="200" height="44" rx="8"/>
  <text x="420" y="187" text-anchor="middle"><tspan class="code">gitVersion: v1.35.2</tspan></text>
  <rect class="box" x="600" y="160" width="200" height="44" rx="8"/>
  <text x="700" y="187" text-anchor="middle"><tspan class="code">gitVersion: v1.33.9</tspan></text>

  <rect class="drop" x="30" y="240" width="220" height="62" rx="8"/>
  <text class="strong bad" x="140" y="264" text-anchor="middle">Affected</text>
  <text x="140" y="286" text-anchor="middle">Patch to <tspan class="code">v1.35.2</tspan> or newer</text>
  <rect class="ok" x="310" y="240" width="220" height="62" rx="8"/>
  <text class="strong good" x="420" y="264" text-anchor="middle">Not affected</text>
  <text x="420" y="286" text-anchor="middle">The fix is installed</text>
  <rect class="drop" x="590" y="240" width="220" height="62" rx="8"/>
  <text class="strong bad" x="700" y="264" text-anchor="middle">Affected</text>
  <text x="700" y="286" text-anchor="middle">Move to a listed version</text>
</svg>
