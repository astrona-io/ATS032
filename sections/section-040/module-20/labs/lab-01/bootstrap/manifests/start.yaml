apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-040-02-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-032-040-02-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/busybox:PROBE_TAG
        command:
        - sh
        - -c
        - sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
