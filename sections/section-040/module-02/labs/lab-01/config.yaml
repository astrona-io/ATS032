apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-02-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.36.1
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: node-versions
    description: version-inventory records the API server version, both kubelet versions and the container runtime of the worker as the cluster reports them
    type: file
    source: validation/validate-node-versions.sh
    points: 1
  - name: component-images
    description: version-inventory records the images of the etcd and CoreDNS Pods
    type: file
    source: validation/validate-component-images.sh
    points: 1
  - name: workload-digest
    description: version-inventory records the image of the Deployment probe and the sha256 digest that its running Pods report
    type: file
    source: validation/validate-workload-digest.sh
    points: 1
