apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-02-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.36.1
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: affected-records
    description: The ConfigMap triage lists exactly the advisory-feed records whose range contains a version that the cluster runs
    type: file
    source: validation/validate-affected-records.sh
    points: 1
  - name: patch-waves
    description: The control plane node has the label patch-wave=1 and the worker has patch-wave=2
    type: file
    source: validation/validate-patch-waves.sh
    points: 1
