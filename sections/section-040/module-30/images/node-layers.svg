<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">The four layers of a node and who patches them</title>
  <desc id="desc">The node controlplane has four layers: the Kubernetes node packages kubelet, kubeadm and kubectl, the container runtime containerd, the operating system packages and the kernel. The Kubernetes upgrade procedure patches the node packages. The distribution tools such as apt patch the other three layers, and a kernel patch takes effect only after a reboot.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M560 97 H452" marker-end="url(#arrow)"/>
  <path class="line" d="M560 255 L452 167" marker-end="url(#arrow)"/>
  <path class="line" d="M560 255 H452" marker-end="url(#arrow)"/>
  <path class="line" d="M560 255 L452 313" marker-end="url(#arrow)"/>

  <rect class="frame" x="30" y="40" width="440" height="320" rx="10"/>
  <text class="label" x="50" y="62">node <tspan class="code">controlplane</tspan></text>

  <rect class="box" x="50" y="72" width="400" height="50" rx="8"/>
  <text x="250" y="93" text-anchor="middle" class="strong">Kubernetes node packages</text>
  <text x="250" y="112" text-anchor="middle" class="code">kubelet, kubeadm, kubectl</text>

  <rect class="box" x="50" y="142" width="400" height="50" rx="8"/>
  <text x="250" y="163" text-anchor="middle" class="strong">Container runtime</text>
  <text x="250" y="182" text-anchor="middle" class="code">containerd 2.2.1</text>

  <rect class="box" x="50" y="212" width="400" height="50" rx="8"/>
  <text x="250" y="233" text-anchor="middle" class="strong">Operating system packages</text>
  <text x="250" y="252" text-anchor="middle">system libraries and tools, such as <tspan class="code">openssl</tspan></text>

  <rect class="box" x="50" y="290" width="400" height="50" rx="8"/>
  <text x="250" y="311" text-anchor="middle" class="strong">Kernel</text>
  <text x="250" y="330" text-anchor="middle">shared by every container on the node</text>

  <rect class="policy" x="560" y="70" width="250" height="54" rx="8"/>
  <text x="685" y="93" text-anchor="middle" class="strong">Kubernetes upgrade</text>
  <text x="685" y="112" text-anchor="middle">procedure</text>

  <rect class="ask" x="560" y="226" width="250" height="58" rx="8"/>
  <text x="685" y="250" text-anchor="middle" class="strong">Distribution tools</text>
  <text x="685" y="270" text-anchor="middle">such as <tspan class="code">apt</tspan></text>
  <text class="label" x="685" y="310" text-anchor="middle">A kernel patch takes effect</text>
  <text class="label" x="685" y="328" text-anchor="middle">only after a reboot.</text>
</svg>
