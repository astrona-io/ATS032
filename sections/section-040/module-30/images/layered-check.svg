<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="title desc">
  <title id="title">The layered post-upgrade check</title>
  <desc id="desc">The check starts at the bottom and moves up only when a layer passes: nodes with kubectl get nodes, the API server with livez and readyz, system Pods, application Pods, disruption budgets with kubectl get pdb, deprecated APIs with the apiserver_requested_deprecated_apis metric, and a real request through the Service.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M170 436 V418" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 372 V354" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 308 V290" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 244 V226" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 180 V162" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 116 V98" marker-end="url(#arrowok)"/>

  <text class="label" x="40" y="30">Start at the bottom. Move up only when the layer below has passed.</text>

  <rect class="ok" x="40" y="52" width="260" height="44" rx="8"/>
  <text x="170" y="79" text-anchor="middle">A real request</text>
  <text class="code" x="330" y="79">wget -q -T 3 -O- http://probe/</text>

  <rect class="box" x="40" y="116" width="260" height="44" rx="8"/>
  <text x="170" y="143" text-anchor="middle">Deprecated APIs</text>
  <text class="code" x="330" y="143">apiserver_requested_deprecated_apis</text>

  <rect class="box" x="40" y="180" width="260" height="44" rx="8"/>
  <text x="170" y="207" text-anchor="middle">Disruption budgets</text>
  <text class="code" x="330" y="207">kubectl get pdb -A</text>

  <rect class="box" x="40" y="244" width="260" height="44" rx="8"/>
  <text x="170" y="271" text-anchor="middle">Application Pods</text>
  <text class="code" x="330" y="271">kubectl -n starfleet get pods -l app=probe</text>

  <rect class="box" x="40" y="308" width="260" height="44" rx="8"/>
  <text x="170" y="335" text-anchor="middle">System Pods</text>
  <text class="code" x="330" y="335">kubectl get pods -A --field-selector=status.phase!=Running</text>

  <rect class="box" x="40" y="372" width="260" height="44" rx="8"/>
  <text x="170" y="399" text-anchor="middle">API server</text>
  <text class="code" x="330" y="399">/livez?verbose  /readyz?verbose</text>

  <rect class="box" x="40" y="436" width="260" height="44" rx="8"/>
  <text x="170" y="463" text-anchor="middle">Nodes</text>
  <text class="code" x="330" y="463">kubectl get nodes -o wide</text>
</svg>
