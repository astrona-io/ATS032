<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">An etcd snapshot and restore drill</title>
  <desc id="desc">etcdctl snapshot save writes the running etcd database to before-upgrade.db with mode 0600. etcdutl snapshot status verifies the file. etcdutl snapshot restore writes it into the new, empty directory /var/lib/etcd-drill. A second restore into the same directory is refused because the directory is not empty. The live directory /var/lib/etcd is not touched.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M212 88 H328" marker-end="url(#arrowok)"/>
  <path class="line" d="M532 88 H618" marker-end="url(#arrow)"/>
  <path class="okline" d="M430 116 V218" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M620 248 H534" marker-end="url(#arrowbad)"/>

  <text class="label code" x="270" y="78" text-anchor="middle">etcdctl</text>
  <text class="label" x="270" y="108" text-anchor="middle">snapshot save</text>
  <text class="label code" x="575" y="78" text-anchor="middle">etcdutl</text>
  <text class="label code" x="442" y="162">etcdutl</text>
  <text class="label" x="442" y="180">snapshot restore</text>

  <rect class="box" x="30" y="60" width="180" height="56" rx="8"/>
  <text x="120" y="83" text-anchor="middle">running etcd</text>
  <text x="120" y="104" text-anchor="middle" class="code">/var/lib/etcd</text>
  <text class="label" x="120" y="140" text-anchor="middle">not touched by the drill</text>

  <rect class="box" x="330" y="60" width="200" height="56" rx="8"/>
  <text x="430" y="83" text-anchor="middle" class="code">before-upgrade.db</text>
  <text x="430" y="104" text-anchor="middle">mode <tspan class="code">0600</tspan></text>

  <rect class="ask" x="620" y="60" width="190" height="56" rx="8"/>
  <text x="715" y="83" text-anchor="middle" class="code">snapshot status</text>
  <text x="715" y="104" text-anchor="middle">388 keys, revision 823</text>

  <rect class="ok" x="330" y="220" width="200" height="56" rx="8"/>
  <text x="430" y="243" text-anchor="middle" class="code">/var/lib/etcd-drill</text>
  <text x="430" y="264" text-anchor="middle">new, empty directory</text>

  <rect class="drop" x="620" y="220" width="190" height="56" rx="8"/>
  <text x="715" y="243" text-anchor="middle">second restore</text>
  <text x="715" y="264" text-anchor="middle">refused: not empty</text>
  <text class="label" x="430" y="306" text-anchor="middle">same 388 keys and revision 823 as the snapshot</text>
</svg>
