<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Cordon, uncordon and a custom taint</title>
  <desc id="desc">After kubectl cordon and kubectl taint, the node has unschedulable true, the custom taint maintenance=patching:NoSchedule and the taint node.kubernetes.io/unschedulable:NoSchedule. After kubectl uncordon, unschedulable is false and the node controller removed its own taint, but the custom taint stays. After kubectl taint with a trailing minus, the node has no taints.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M265 195 H300" marker-end="url(#arrow)"/>
  <path class="line" d="M558 195 H593" marker-end="url(#arrow)"/>

  <text class="strong" x="137" y="28" text-anchor="middle">After cordon and taint</text>
  <text class="code" x="137" y="50" text-anchor="middle">kubectl cordon controlplane</text>
  <text class="strong" x="430" y="28" text-anchor="middle">After uncordon</text>
  <text class="code" x="430" y="50" text-anchor="middle">kubectl uncordon controlplane</text>
  <text class="strong" x="722" y="28" text-anchor="middle">After removing the taint</text>
  <text class="code" x="722" y="50" text-anchor="middle">kubectl taint ... NoSchedule-</text>

  <rect class="frame" x="10" y="70" width="255" height="230" rx="10"/>
  <text class="label" x="24" y="92">node <tspan class="code">controlplane</tspan></text>
  <rect class="ask" x="20" y="104" width="235" height="36" rx="6"/>
  <text class="code" x="137" y="127" text-anchor="middle">unschedulable: true</text>
  <rect class="ask" x="20" y="152" width="235" height="36" rx="6"/>
  <text class="code" x="137" y="175" text-anchor="middle" style="font-size: 11.5px">maintenance=patching:NoSchedule</text>
  <rect class="ask" x="20" y="200" width="235" height="52" rx="6"/>
  <text class="code" x="137" y="222" text-anchor="middle">node.kubernetes.io/</text>
  <text class="code" x="137" y="241" text-anchor="middle">unschedulable:NoSchedule</text>
  <text class="label" x="137" y="282" text-anchor="middle">Taints: two</text>

  <rect class="frame" x="303" y="70" width="255" height="230" rx="10"/>
  <text class="label" x="317" y="92">node <tspan class="code">controlplane</tspan></text>
  <rect class="ok" x="313" y="104" width="235" height="36" rx="6"/>
  <text class="code" x="430" y="127" text-anchor="middle">unschedulable: false</text>
  <rect class="drop" x="313" y="152" width="235" height="36" rx="6"/>
  <text class="code" x="430" y="175" text-anchor="middle" style="font-size: 11.5px">maintenance=patching:NoSchedule</text>
  <rect class="frame" x="313" y="200" width="235" height="52" rx="6"/>
  <text class="label" x="430" y="222" text-anchor="middle">node controller removed</text>
  <text class="label" x="430" y="241" text-anchor="middle">its own taint</text>
  <text class="label bad" x="430" y="282" text-anchor="middle">The custom taint stays.</text>

  <rect class="frame" x="596" y="70" width="255" height="230" rx="10"/>
  <text class="label" x="610" y="92">node <tspan class="code">controlplane</tspan></text>
  <rect class="ok" x="606" y="104" width="235" height="36" rx="6"/>
  <text class="code" x="722" y="127" text-anchor="middle">unschedulable: false</text>
  <rect class="ok" x="606" y="152" width="235" height="36" rx="6"/>
  <text class="code" x="722" y="175" text-anchor="middle">Taints: &lt;none&gt;</text>
  <text class="label good" x="722" y="282" text-anchor="middle">The node is back to normal.</text>
</svg>
