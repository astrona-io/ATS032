<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">The three data paths in the etcd manifest</title>
  <desc id="desc">Inside the etcd container, line 18 sets --data-dir=/var/lib/etcd and line 75 mounts the volume etcd-data at /var/lib/etcd. Line 91 is the hostPath of that volume on the node. Before the restore it points at /var/lib/etcd; for a restore only line 91 changes, to /var/lib/etcd-restore, so the container path stays the same.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M170 146 V188" marker-end="url(#arrow)"/>
  <path class="dashed" d="M305 204 L553 124" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M305 232 H553" marker-end="url(#arrowok)"/>

  <text class="label" x="180" y="172">same path</text>
  <text class="label bad" x="390" y="150">before</text>
  <text class="label good" x="430" y="222" text-anchor="middle">after: line 91 <tspan class="code">hostPath</tspan></text>
  <text class="label" x="430" y="254" text-anchor="middle">volume <tspan class="code">etcd-data</tspan></text>

  <rect class="frame" x="20" y="40" width="300" height="270" rx="10"/>
  <text class="label" x="36" y="64">etcd container</text>
  <rect class="box" x="35" y="90" width="270" height="56" rx="8"/>
  <text x="170" y="113" text-anchor="middle">line 18: the flag</text>
  <text x="170" y="134" text-anchor="middle" class="code">--data-dir=/var/lib/etcd</text>
  <rect class="box" x="35" y="190" width="270" height="56" rx="8"/>
  <text x="170" y="213" text-anchor="middle">line 75: <tspan class="code">mountPath</tspan></text>
  <text x="170" y="234" text-anchor="middle" class="code">/var/lib/etcd</text>

  <rect class="frame" x="540" y="40" width="280" height="270" rx="10"/>
  <text class="label" x="556" y="64">node <tspan class="code">controlplane</tspan></text>
  <rect class="box" x="555" y="90" width="250" height="56" rx="8" opacity="0.6"/>
  <text x="680" y="113" text-anchor="middle" class="code" opacity="0.6">/var/lib/etcd</text>
  <text x="680" y="134" text-anchor="middle" opacity="0.6">old data</text>
  <rect class="ok" x="555" y="204" width="250" height="56" rx="8"/>
  <text x="680" y="227" text-anchor="middle" class="code">/var/lib/etcd-restore</text>
  <text x="680" y="248" text-anchor="middle">restored data</text>

  <text x="420" y="345" text-anchor="middle">Change only line 91. The flag and the <tspan class="code">mountPath</tspan> stay <tspan class="code">/var/lib/etcd</tspan>.</text>
</svg>
