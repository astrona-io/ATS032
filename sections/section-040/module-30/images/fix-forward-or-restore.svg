<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Fix forward or restore etcd</title>
  <desc id="desc">After an upgrade goes wrong, ask whether the control plane and its data are healthy. If yes and only a component or application is broken, fix forward on the new version. If the control plane or the data is damaged, restore etcd from the snapshot taken before the upgrade, which loses every change made after the snapshot.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M420 80 V108" marker-end="url(#arrow)"/>
  <path class="okline" d="M320 158 L200 226" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M520 158 L640 226" marker-end="url(#arrowbad)"/>
  <text class="label good" x="232" y="186" text-anchor="end">healthy</text>
  <text class="label bad" x="608" y="186">damaged</text>

  <rect class="box" x="300" y="30" width="240" height="50" rx="8"/>
  <text x="420" y="60" text-anchor="middle">The upgrade went wrong</text>

  <rect class="ask" x="200" y="110" width="440" height="48" rx="8"/>
  <text x="420" y="139" text-anchor="middle">Are the control plane and its data healthy?</text>

  <rect class="ok" x="40" y="228" width="320" height="58" rx="8"/>
  <text x="200" y="252" text-anchor="middle" class="strong">Fix forward</text>
  <text x="200" y="274" text-anchor="middle">repair the problem on the new version</text>
  <text class="label" x="200" y="314" text-anchor="middle">Right when the cluster works and</text>
  <text class="label" x="200" y="332" text-anchor="middle">one component or application is broken.</text>

  <rect class="drop" x="480" y="228" width="320" height="58" rx="8"/>
  <text x="640" y="252" text-anchor="middle" class="strong">Restore etcd</text>
  <text x="640" y="274" text-anchor="middle">from the snapshot before the upgrade</text>
  <text class="label" x="640" y="314" text-anchor="middle">Right when the control plane or the data</text>
  <text class="label" x="640" y="332" text-anchor="middle">is damaged.</text>
  <text class="label bad" x="640" y="356" text-anchor="middle">Every change after the snapshot is lost.</text>
</svg>
