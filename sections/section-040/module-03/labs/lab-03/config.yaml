apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-03-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-{ARCH}
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster, copies etcdctl and etcdutl out of the etcd image, takes the nightly snapshot and then changes the cluster
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    description: Restore the snapshot into /var/lib/etcd-restore and point the etcd static Pod at it
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until etcd runs on the restored data and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: etcd-on-restored-data
    description: etcd is healthy and its static Pod manifest mounts a restored data directory instead of /var/lib/etcd
    type: file
    source: validation/validate-etcd-on-restored-data.sh
    points: 1
  - name: roster-restored
    description: The ConfigMap fleet-roster from the snapshot is back, with its original UID
    type: file
    source: validation/validate-roster-restored.sh
    points: 1
  - name: later-change-gone
    description: The ConfigMap course-correction, created after the snapshot, no longer exists
    type: file
    source: validation/validate-later-change-gone.sh
    points: 1
teardown:
  keepCluster: false
