apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-03-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-{ARCH}
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster, starts the probe Deployment, records the containerd baseline and cordons the node
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    description: Drain the node, restart containerd, wait for Ready and uncordon
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the probe Pods run again and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: runtime-restarted
    description: containerd on node controlplane is active and started again after the lab began
    type: file
    source: validation/validate-runtime-restarted.sh
    points: 1
  - name: probe-pods-replaced
    description: None of the probe Pods from the start remains, and two probe Pods are available
    type: file
    source: validation/validate-probe-pods-replaced.sh
    points: 1
  - name: node-in-service
    description: Node controlplane is Ready and schedulable again
    type: file
    source: validation/validate-node-in-service.sh
    points: 1
teardown:
  keepCluster: false
