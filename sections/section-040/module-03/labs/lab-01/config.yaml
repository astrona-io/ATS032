apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 2
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: worker2-schedulable
    description: The second worker is schedulable and has no maintenance taint
    type: file
    source: validation/validate-worker2-schedulable.sh
    points: 1
  - name: probe-spread
    description: Both probe replicas are ready on two different nodes
    type: file
    source: validation/validate-probe-spread.sh
    points: 1
  - name: budget-max-unavailable
    description: PodDisruptionBudget probe uses maxUnavailable 1 only
    type: file
    source: validation/validate-budget-max-unavailable.sh
    points: 1
  - name: post-maintenance-record
    description: ConfigMap post-maintenance-record has the verified data
    type: file
    source: validation/validate-post-maintenance-record.sh
    points: 1
