apiVersion: astrona.io/v1
metadata:
  name: ats-032-playground-040-03
  docs:
    guide: docs/overview.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster, copies etcdctl and etcdutl out of the etcd image and starts the example workloads
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
