apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-01-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster, installs etcdctl and etcdutl from the etcd image and creates the ConfigMap upgrade-ticket
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    description: Save the etcd snapshot with etcdctl and record its revision
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: snapshot-saved
    description: /var/lib/etcd/backup/pre-upgrade.db on node controlplane is a valid etcd snapshot taken after the lab started
    type: file
    source: validation/validate-snapshot-saved.sh
    points: 1
  - name: snapshot-recorded
    description: The ConfigMap snapshot-record holds the revision that etcdutl snapshot status reports for that file
    type: file
    source: validation/validate-snapshot-recorded.sh
    points: 1
teardown:
  keepCluster: false
