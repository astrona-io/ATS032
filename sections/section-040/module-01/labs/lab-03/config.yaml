apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-01-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: snapshot-saved
    description: /var/lib/etcd/backup/pre-upgrade.db on the control plane node is a valid etcd snapshot taken after the lab started
    type: file
    source: validation/validate-snapshot-saved.sh
    points: 1
  - name: snapshot-recorded
    description: The ConfigMap snapshot-record holds the revision that etcdutl snapshot status reports for that file
    type: file
    source: validation/validate-snapshot-recorded.sh
    points: 1
