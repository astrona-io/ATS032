apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-01-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster at v1.35 from pre-pulled images and starts the probe Deployment
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    description: Upgrade the control plane, kubelet and kubectl to v1.36 with kubeadm
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the restarted kubelet and static Pods answer and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: control-plane-upgraded
    description: The API server, controller manager, scheduler and kube-proxy run v1.36, and kubeadm-config records v1.36
    type: file
    source: validation/validate-control-plane-upgraded.sh
    points: 2
  - name: packages-held
    description: kubeadm, kubelet and kubectl are installed at 1.35 and on hold
    type: file
    source: validation/validate-packages-held.sh
    points: 1
  - name: node-uncordoned
    description: Node controlplane is Ready and schedulable with a v1.36 kubelet, and Deployment probe is available
    type: file
    source: validation/validate-node-uncordoned.sh
    points: 1
teardown:
  keepCluster: false
