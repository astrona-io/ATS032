apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-040-01-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-kubeadm-20261117-{ARCH}
      checksums:
        amd64: sha256:69438739d55d00a48357f218743d7af6f33def8fa5e838c57556053814e7890e
        arm64: sha256:6fc0d4c0e6b538adfdb67497ead8d7e2abd8cc1bb03d868a64212669d7d8b110
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster at v1.34 from pre-pulled images and starts the probe Deployment
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    description: Upgrade the control plane, kubelet and kubectl to v1.35 with kubeadm
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the restarted kubelet and static Pods answer and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: control-plane-upgraded
    description: The API server, controller manager, scheduler and kube-proxy run v1.35, and kubeadm-config records v1.35
    type: file
    source: validation/validate-control-plane-upgraded.sh
    points: 2
  - name: packages-held
    description: kubeadm, kubelet and kubectl are installed at 1.35 and on hold
    type: file
    source: validation/validate-packages-held.sh
    points: 1
  - name: node-uncordoned
    description: Node controlplane is Ready and schedulable with a v1.35 kubelet, and Deployment probe is available
    type: file
    source: validation/validate-node-uncordoned.sh
    points: 1
teardown:
  keepCluster: false
