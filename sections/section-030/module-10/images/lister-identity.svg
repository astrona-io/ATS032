<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc">
  <title id="title">The lister identity of the probe Pods</title>
  <desc id="desc">In the starfleet namespace, the probe Pods run as the ServiceAccount lister. The RoleBinding service-lister-bind gives the Role service-lister to lister, and the Role allows get and list on services. With the lister token, listing Services in starfleet returns 200, and listing Pods, Secrets or Services in outpost returns 403.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="30" width="540" height="350" rx="10"/>
  <text class="label" x="36" y="52">namespace <tspan class="code">starfleet</tspan></text>

  <path class="line" d="M190 105 H248" marker-end="url(#arrow)"/>
  <text class="label" x="219" y="96" text-anchor="middle">runs as</text>
  <path class="line" d="M325 228 V132" marker-end="url(#arrow)"/>
  <text class="label" x="335" y="167">subject</text>
  <path class="line" d="M325 260 V298" marker-end="url(#arrow)"/>
  <text class="label" x="335" y="284">roleRef</text>

  <rect class="box" x="40" y="80" width="150" height="50" rx="8"/>
  <text x="115" y="110" text-anchor="middle"><tspan class="code">probe</tspan> Pods</text>
  <rect class="box" x="250" y="72" width="150" height="58" rx="8"/>
  <text x="325" y="96" text-anchor="middle">ServiceAccount</text>
  <text x="325" y="118" text-anchor="middle" class="code">lister</text>
  <rect class="policy" x="210" y="200" width="230" height="58" rx="8"/>
  <text x="325" y="224" text-anchor="middle">RoleBinding</text>
  <text x="325" y="246" text-anchor="middle" class="code">service-lister-bind</text>
  <rect class="ask" x="210" y="300" width="230" height="64" rx="8"/>
  <text x="325" y="322" text-anchor="middle">Role <tspan class="code">service-lister</tspan></text>
  <text x="325" y="346" text-anchor="middle"><tspan class="code">get</tspan>, <tspan class="code">list</tspan> on <tspan class="code">services</tspan></text>

  <text class="label" x="720" y="52" text-anchor="middle">Requests with the <tspan class="code">lister</tspan> token</text>
  <rect class="ok" x="600" y="72" width="240" height="44" rx="8"/>
  <text x="720" y="99" text-anchor="middle">Services in <tspan class="code">starfleet</tspan>: 200</text>
  <rect class="drop" x="600" y="146" width="240" height="44" rx="8"/>
  <text x="720" y="173" text-anchor="middle">Pods in <tspan class="code">starfleet</tspan>: 403</text>
  <rect class="drop" x="600" y="220" width="240" height="44" rx="8"/>
  <text x="720" y="247" text-anchor="middle">Secrets in <tspan class="code">starfleet</tspan>: 403</text>
  <rect class="drop" x="600" y="294" width="240" height="44" rx="8"/>
  <text x="720" y="321" text-anchor="middle">Services in <tspan class="code">outpost</tspan>: 403</text>
</svg>
