<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc">
  <title id="title">What NodeRestriction lets a kubelet write</title>
  <desc id="desc">A kubelet authenticates in the group system:nodes and sends write requests through the NodeRestriction admission plugin. The plugin allows changes to the kubelet's own Node object and to Pods bound to its own node. It rejects changes to another Node object, to Pods on another node, and to labels with the node-restriction.kubernetes.io/ prefix.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 180 H278" marker-end="url(#arrow)"/>
  <text class="label" x="239" y="170" text-anchor="middle">writes</text>
  <path class="okline" d="M430 180 C490 180 490 62 538 62" marker-end="url(#arrowok)"/>
  <path class="okline" d="M430 180 C490 180 490 122 538 122" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M430 180 C490 180 490 192 538 192" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M430 180 C490 180 490 252 538 252" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M430 180 C490 180 490 312 538 312" marker-end="url(#arrowbad)"/>

  <rect class="box" x="30" y="150" width="170" height="60" rx="8"/>
  <text x="115" y="174" text-anchor="middle" class="code">kubelet</text>
  <text x="115" y="196" text-anchor="middle">group <tspan class="code">system:nodes</tspan></text>
  <rect class="policy" x="280" y="130" width="150" height="100" rx="8"/>
  <text x="355" y="174" text-anchor="middle" class="strong">NodeRestriction</text>
  <text x="355" y="196" text-anchor="middle">admission plugin</text>

  <rect class="ok" x="540" y="40" width="300" height="44" rx="8"/>
  <text x="690" y="67" text-anchor="middle">its own Node object</text>
  <rect class="ok" x="540" y="100" width="300" height="44" rx="8"/>
  <text x="690" y="127" text-anchor="middle">Pods bound to its own node</text>
  <rect class="drop" x="540" y="170" width="300" height="44" rx="8"/>
  <text x="690" y="197" text-anchor="middle">another Node object</text>
  <rect class="drop" x="540" y="230" width="300" height="44" rx="8"/>
  <text x="690" y="257" text-anchor="middle">Pods on another node</text>
  <rect class="drop" x="540" y="290" width="300" height="44" rx="8"/>
  <text x="690" y="317" text-anchor="middle" class="code" style="font-size:12px">node-restriction.kubernetes.io/ labels</text>
</svg>
