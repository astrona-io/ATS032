<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc">
  <title id="title">How the API server checks a request</title>
  <desc id="desc">A request passes authentication, then authorization, then admission. If authentication fails, the answer is 401 Unauthorized. If no authorizer allows the request, the answer is 403 Forbidden. If an admission controller rejects a write, the request is rejected with an error. Only a write that passes all three checks is stored in etcd.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M170 78 V118" marker-end="url(#arrow)"/>
  <path class="okline" d="M170 168 V208" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 258 V298" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 348 V388" marker-end="url(#arrowok)"/>
  <text class="label" x="182" y="103">credential</text>
  <text class="label good" x="182" y="193">user and groups</text>
  <text class="label good" x="182" y="283">allowed, write request</text>
  <text class="label good" x="182" y="373">accepted</text>

  <path class="dashed" d="M280 144 H498" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M280 234 H498" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M280 324 H498" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="390" y="134" text-anchor="middle">no valid identity, anonymous off</text>
  <text class="label bad" x="390" y="224" text-anchor="middle">no rule allows</text>
  <text class="label bad" x="390" y="314" text-anchor="middle">policy rejects</text>

  <rect class="box" x="60" y="30" width="220" height="48" rx="8"/>
  <text x="170" y="59" text-anchor="middle">Request</text>
  <rect class="ask" x="60" y="120" width="220" height="48" rx="8"/>
  <text x="170" y="149" text-anchor="middle">1. Authentication</text>
  <rect class="ask" x="60" y="210" width="220" height="48" rx="8"/>
  <text x="170" y="239" text-anchor="middle">2. Authorization</text>
  <rect class="ask" x="60" y="300" width="220" height="48" rx="8"/>
  <text x="170" y="329" text-anchor="middle">3. Admission</text>
  <rect class="ok" x="60" y="390" width="220" height="48" rx="8"/>
  <text x="170" y="419" text-anchor="middle">Stored in <tspan class="code">etcd</tspan></text>

  <rect class="drop" x="500" y="120" width="220" height="48" rx="8"/>
  <text x="610" y="149" text-anchor="middle" class="code">401 Unauthorized</text>
  <rect class="drop" x="500" y="210" width="220" height="48" rx="8"/>
  <text x="610" y="239" text-anchor="middle" class="code">403 Forbidden</text>
  <rect class="drop" x="500" y="300" width="220" height="48" rx="8"/>
  <text x="610" y="329" text-anchor="middle">Request rejected</text>
</svg>
