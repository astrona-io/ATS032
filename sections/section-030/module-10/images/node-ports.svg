<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Ports on the control-plane node and who should reach them</title>
  <desc id="desc">Port 6443 of kube-apiserver should be reachable by administrators, nodes and the control-plane components. Port 10250 of the kubelet should be reachable by the control plane and monitoring. Ports 2379 and 2380 of etcd should be reachable by the API server and the other etcd members. The read-only port 10255 is closed.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="320" y="30" width="440" height="370" rx="10"/>
  <text class="label" x="336" y="52">node <tspan class="code">controlplane</tspan></text>

  <path class="okline" d="M280 99 H368" marker-end="url(#arrowok)"/>
  <path class="okline" d="M280 184 H368" marker-end="url(#arrowok)"/>
  <path class="okline" d="M280 269 H368" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M280 354 H368" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="72" width="260" height="54" rx="8"/>
  <text x="150" y="95" text-anchor="middle">administrators, nodes,</text>
  <text x="150" y="115" text-anchor="middle">control-plane components</text>
  <rect class="box" x="20" y="160" width="260" height="48" rx="8"/>
  <text x="150" y="189" text-anchor="middle">control plane, monitoring</text>
  <rect class="box" x="20" y="242" width="260" height="54" rx="8"/>
  <text x="150" y="265" text-anchor="middle">API server,</text>
  <text x="150" y="285" text-anchor="middle">other etcd members</text>
  <rect class="box" x="20" y="330" width="260" height="48" rx="8"/>
  <text x="150" y="359" text-anchor="middle">any caller</text>

  <rect class="ok" x="370" y="72" width="360" height="54" rx="8"/>
  <text x="550" y="104" text-anchor="middle"><tspan class="code">kube-apiserver</tspan>, port <tspan class="code">6443</tspan></text>
  <rect class="ok" x="370" y="157" width="360" height="54" rx="8"/>
  <text x="550" y="189" text-anchor="middle"><tspan class="code">kubelet</tspan>, port <tspan class="code">10250</tspan></text>
  <rect class="ok" x="370" y="242" width="360" height="54" rx="8"/>
  <text x="550" y="274" text-anchor="middle"><tspan class="code">etcd</tspan>, ports <tspan class="code">2379</tspan> and <tspan class="code">2380</tspan></text>
  <rect class="drop" x="370" y="327" width="360" height="54" rx="8"/>
  <text x="550" y="359" text-anchor="middle">read-only port <tspan class="code">10255</tspan>: closed</text>
</svg>
