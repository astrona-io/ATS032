<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous and token callers</title>
  <desc id="desc">A request without a credential becomes system:anonymous in the group system:unauthenticated. A request with the mounted token becomes the default ServiceAccount of starfleet. Both identities may read /version and get 200, and both get 403 when they list Pods in starfleet.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="label" x="90" y="34" text-anchor="middle">Request</text>
  <text class="label" x="395" y="34" text-anchor="middle">Authentication gives</text>
  <text class="label" x="740" y="34" text-anchor="middle">Authorization answers</text>
  <line class="sep" x1="20" y1="195" x2="840" y2="195"/>

  <path class="line" d="M160 115 H228" marker-end="url(#arrow)"/>
  <path class="okline" d="M560 105 C600 105 600 80 638 80" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M560 125 C600 125 600 150 638 150" marker-end="url(#arrowbad)"/>
  <path class="line" d="M160 275 H228" marker-end="url(#arrow)"/>
  <path class="okline" d="M560 265 C600 265 600 240 638 240" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M560 285 C600 285 600 310 638 310" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="91" width="140" height="48" rx="8"/>
  <text x="90" y="120" text-anchor="middle">no credential</text>
  <rect class="box" x="230" y="85" width="330" height="60" rx="8"/>
  <text x="395" y="110" text-anchor="middle" class="code">system:anonymous</text>
  <text x="395" y="132" text-anchor="middle">group <tspan class="code">system:unauthenticated</tspan></text>

  <rect class="box" x="20" y="251" width="140" height="48" rx="8"/>
  <text x="90" y="280" text-anchor="middle">mounted token</text>
  <rect class="box" x="230" y="245" width="330" height="60" rx="8"/>
  <text x="395" y="270" text-anchor="middle" class="code" style="font-size:12px">system:serviceaccount:starfleet:default</text>
  <text x="395" y="292" text-anchor="middle"><tspan class="code">default</tspan> ServiceAccount</text>

  <rect class="ok" x="640" y="58" width="200" height="44" rx="8"/>
  <text x="740" y="85" text-anchor="middle">read <tspan class="code">/version</tspan>: 200</text>
  <rect class="drop" x="640" y="128" width="200" height="44" rx="8"/>
  <text x="740" y="155" text-anchor="middle">list Pods: 403</text>
  <rect class="ok" x="640" y="218" width="200" height="44" rx="8"/>
  <text x="740" y="245" text-anchor="middle">read <tspan class="code">/version</tspan>: 200</text>
  <rect class="drop" x="640" y="288" width="200" height="44" rx="8"/>
  <text x="740" y="315" text-anchor="middle">list Pods: 403</text>
</svg>
