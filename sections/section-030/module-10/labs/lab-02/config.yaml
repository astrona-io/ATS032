apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-01-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster, opens the kubelet API on node controlplane and starts the Pod probe
    type: file
    source: vm/install.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    description: Harden the kubelet configuration on node controlplane and restart the kubelet
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the restarted kubelet answers and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: kubelet-config-hardened
    description: The kubelet on node controlplane runs with anonymous authentication off, Webhook authorization and no read-only port
    type: file
    source: vm/validate-kubelet-config-hardened.sh
    points: 1
  - name: kubelet-anon-rejected
    description: An anonymous request to port 10250 of node controlplane gets 401 and port 10255 refuses connections
    type: file
    source: vm/validate-kubelet-anon-rejected.sh
    points: 1
  - name: node-ready
    description: Node controlplane is Ready with the hardened kubelet and the API server still reads Pod logs from it
    type: file
    source: vm/validate-node-ready.sh
    points: 1
teardown:
  keepCluster: false
