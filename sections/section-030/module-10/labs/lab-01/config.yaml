apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-01-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    preloadImages:
    - docker.io/library/python:3.13-alpine
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: observer-rbac
    description: The ServiceAccount observer can only get and list Pods in its own namespace, through the RoleBinding observer-read
    type: file
    source: validation/validate-observer-rbac.sh
    points: 1
  - name: probe-uses-observer
    description: The probe Pods run as observer, and their own token reads the Pod list but not Secrets or another namespace
    type: file
    source: validation/validate-probe-uses-observer.sh
    points: 1
