apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-02-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: apiserver-no-token-file
    description: The kube-apiserver manifest has no --token-auth-file flag and the token file is deleted
    type: file
    source: validation/validate-apiserver-no-token-file.sh
    points: 1
  - name: static-token-rejected
    description: A request with the old static token gets 401
    type: file
    source: validation/validate-static-token-rejected.sh
    points: 1
  - name: apiserver-ready
    description: The kube-apiserver Pod is Ready and runs without the --token-auth-file flag
    type: file
    source: validation/validate-apiserver-ready.sh
    points: 1
