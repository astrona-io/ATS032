apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-02-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster and turns on static token authentication with a system:masters token in the kube-apiserver
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    description: Remove --token-auth-file from the kube-apiserver manifest and delete the token file
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the restarted API server answers and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: apiserver-no-token-file
    description: The kube-apiserver manifest has no --token-auth-file flag and the token file is deleted
    type: file
    source: validation/validate-apiserver-no-token-file.sh
    points: 1
  - name: static-token-rejected
    description: A request with the old static token gets 401
    type: file
    source: validation/validate-static-token-rejected.sh
    points: 1
  - name: apiserver-ready
    description: The kube-apiserver Pod is Ready and runs without the --token-auth-file flag
    type: file
    source: validation/validate-apiserver-ready.sh
    points: 1
teardown:
  keepCluster: false
