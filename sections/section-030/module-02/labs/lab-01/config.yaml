apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-02-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: cluster-anonymous-removed
    description: No ClusterRoleBinding outside the built-in defaults grants anonymous requests, and an anonymous Pod list gets 403
    type: file
    source: validation/validate-cluster-anonymous-removed.sh
    points: 1
  - name: namespace-anonymous-removed
    description: No RoleBinding in the lab namespaces grants anonymous requests, and an anonymous Secret list gets 403
    type: file
    source: validation/validate-namespace-anonymous-removed.sh
    points: 1
