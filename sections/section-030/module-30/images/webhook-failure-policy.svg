<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">What failurePolicy does with a failed call</title>
  <desc id="desc">The API server calls the webhook for a matching request. If the webhook answers allow, the request is admitted. If it answers deny, the request is rejected. If the call fails, failurePolicy Fail rejects the request and failurePolicy Ignore admits it.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="280" y1="182" x2="820" y2="182"/>
  <text class="label" x="300" y="36">the webhook answered</text>
  <text class="label" x="300" y="206">the call to the webhook failed</text>

  <path class="line" d="M200 172 C250 172 250 72 298 72"/>
  <path class="line" d="M200 182 C250 182 250 142 298 142"/>
  <path class="line" d="M200 192 C250 192 250 242 298 242"/>
  <path class="line" d="M200 202 C250 202 250 312 298 312"/>
  <path class="okline" d="M520 72 H598" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M520 142 H598" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M520 242 H598" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M520 312 H598" marker-end="url(#arrowok)"/>

  <rect class="box" x="30" y="157" width="170" height="60" rx="8"/>
  <text x="115" y="182" text-anchor="middle">API server calls</text>
  <text x="115" y="202" text-anchor="middle">the webhook</text>

  <rect class="box" x="300" y="50" width="220" height="44" rx="8"/>
  <text x="410" y="77" text-anchor="middle">answer: allow</text>
  <rect class="box" x="300" y="120" width="220" height="44" rx="8"/>
  <text x="410" y="147" text-anchor="middle">answer: deny</text>
  <rect class="ask" x="300" y="220" width="220" height="44" rx="8"/>
  <text x="410" y="247" text-anchor="middle">call fails, <tspan class="code">Fail</tspan></text>
  <rect class="ask" x="300" y="290" width="220" height="44" rx="8"/>
  <text x="410" y="317" text-anchor="middle">call fails, <tspan class="code">Ignore</tspan></text>

  <rect class="ok" x="600" y="50" width="200" height="44" rx="8"/>
  <text x="700" y="77" text-anchor="middle">Admitted</text>
  <rect class="drop" x="600" y="120" width="200" height="44" rx="8"/>
  <text x="700" y="147" text-anchor="middle">Rejected</text>
  <rect class="drop" x="600" y="220" width="200" height="44" rx="8"/>
  <text x="700" y="247" text-anchor="middle">Rejected</text>
  <rect class="ok" x="600" y="290" width="200" height="44" rx="8"/>
  <text x="700" y="317" text-anchor="middle">Admitted</text>
</svg>
