<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" role="img" aria-labelledby="title desc">
  <title id="title">The path of a write request</title>
  <desc id="desc">A write request passes authentication, then authorization, then admission. Inside admission, mutating webhooks run first, then the API server validates the schema of the object, then validating admission policies and validating webhooks run. Only then does the API server store the object in etcd.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M75 46 V78" marker-end="url(#arrow)"/>
  <path class="line" d="M135 108 H155" marker-end="url(#arrow)"/>
  <path class="line" d="M277 108 H297" marker-end="url(#arrow)"/>
  <path class="line" d="M419 108 H439" marker-end="url(#arrow)"/>
  <path class="line" d="M561 108 H581" marker-end="url(#arrow)"/>
  <path class="okline" d="M703 108 H723" marker-end="url(#arrowok)"/>
  <text class="label" x="15" y="36">write request</text>

  <rect class="frame" x="289" y="50" width="424" height="150" rx="10"/>
  <text class="label" x="701" y="68" text-anchor="end">admission</text>

  <rect class="box" x="15" y="80" width="120" height="56" rx="8"/>
  <text x="75" y="113" text-anchor="middle">Authentication</text>
  <rect class="box" x="157" y="80" width="120" height="56" rx="8"/>
  <text x="217" y="113" text-anchor="middle">Authorization</text>
  <rect class="ask" x="299" y="80" width="120" height="56" rx="8"/>
  <text x="359" y="104" text-anchor="middle">Mutating</text>
  <text x="359" y="124" text-anchor="middle">admission</text>
  <rect class="box" x="441" y="80" width="120" height="56" rx="8"/>
  <text x="501" y="104" text-anchor="middle">Schema</text>
  <text x="501" y="124" text-anchor="middle">validation</text>
  <rect class="ask" x="583" y="80" width="120" height="56" rx="8"/>
  <text x="643" y="104" text-anchor="middle">Validating</text>
  <text x="643" y="124" text-anchor="middle">admission</text>
  <rect class="ok" x="725" y="80" width="120" height="56" rx="8"/>
  <text x="785" y="104" text-anchor="middle">Stored in</text>
  <text class="code" x="785" y="124" text-anchor="middle">etcd</text>

  <text class="label" x="359" y="162" text-anchor="middle">mutating</text>
  <text class="label" x="359" y="180" text-anchor="middle">webhooks</text>
  <text class="label" x="643" y="162" text-anchor="middle">policies and</text>
  <text class="label" x="643" y="180" text-anchor="middle">webhooks</text>
</svg>
