<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Where a rejected Deployment Pod shows its error</title>
  <desc id="desc">The API server stores the Deployment. The ReplicaSet tries to create a Pod. Pod Security admission rejects the Pod. The error appears in the events of the ReplicaSet, and the Deployment shows fewer ready replicas than it wants.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M160 95 H218" marker-end="url(#arrow)"/>
  <path class="line" d="M360 95 H418" marker-end="url(#arrow)"/>
  <path class="dashed" d="M610 95 H668" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M515 120 V170 H452" marker-end="url(#arrowbad)"/>
  <text class="label" x="190" y="60" text-anchor="middle">creates</text>
  <text class="label" x="390" y="60" text-anchor="middle">create Pod</text>
  <text class="label bad" x="640" y="60" text-anchor="middle">rejected</text>
  <text class="label bad" x="527" y="150">error</text>

  <rect class="ok" x="20" y="70" width="140" height="50" rx="8"/>
  <text x="90" y="92" text-anchor="middle">Deployment</text>
  <text class="label" x="90" y="110" text-anchor="middle">stored</text>
  <rect class="box" x="220" y="70" width="140" height="50" rx="8"/>
  <text x="290" y="100" text-anchor="middle">ReplicaSet</text>
  <rect class="ask" x="420" y="70" width="190" height="50" rx="8"/>
  <text x="515" y="100" text-anchor="middle">Pod Security admission</text>
  <rect class="drop" x="670" y="70" width="150" height="50" rx="8"/>
  <text x="745" y="100" text-anchor="middle">Pod not created</text>

  <rect class="box" x="220" y="148" width="230" height="44" rx="8"/>
  <text x="335" y="175" text-anchor="middle">ReplicaSet events</text>
  <text x="20" y="160">Deployment shows</text>
  <text x="20" y="180">fewer ready replicas</text>
</svg>
