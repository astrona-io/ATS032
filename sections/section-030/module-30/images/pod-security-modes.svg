<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Pod Security modes decide the result</title>
  <desc id="desc">A Create Pod request reaches Pod Security admission, which reads the labels of the namespace. A Pod that meets the enforce level is admitted. A Pod that violates the enforce level is rejected. A Pod that violates only the warn or audit level is admitted, with a warning to the user or an annotation in the audit record.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M315 110 V148" marker-end="url(#arrow)"/>
  <path class="line" d="M160 172 H198" marker-end="url(#arrow)"/>
  <path class="okline" d="M430 162 H470 V72 H638" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M430 172 H638" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M430 182 H470 V282 H638" marker-end="url(#arrowok)"/>
  <text class="label good" x="482" y="62">meets enforce level</text>
  <text class="label bad" x="482" y="162">violates enforce level</text>
  <text class="label good" x="482" y="272">violates warn or audit</text>

  <rect class="box" x="200" y="20" width="230" height="90" rx="8"/>
  <text class="label" x="315" y="42" text-anchor="middle">namespace labels</text>
  <text class="code" x="315" y="64" text-anchor="middle">enforce=baseline</text>
  <text class="code" x="315" y="84" text-anchor="middle">warn=restricted</text>
  <text class="label" x="327" y="136">reads</text>

  <rect class="box" x="30" y="150" width="130" height="44" rx="8"/>
  <text x="95" y="177" text-anchor="middle">Create Pod</text>
  <rect class="ask" x="200" y="150" width="230" height="44" rx="8"/>
  <text x="315" y="177" text-anchor="middle">Pod Security admission</text>

  <rect class="ok" x="640" y="50" width="180" height="44" rx="8"/>
  <text x="730" y="77" text-anchor="middle">Admitted</text>
  <rect class="drop" x="640" y="150" width="180" height="44" rx="8"/>
  <text x="730" y="177" text-anchor="middle">Rejected</text>
  <rect class="ok" x="640" y="252" width="180" height="60" rx="8"/>
  <text x="730" y="277" text-anchor="middle">Admitted, with a</text>
  <text x="730" y="298" text-anchor="middle">warning or audit note</text>
</svg>
