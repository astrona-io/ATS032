<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc">
  <title id="title">How a ValidatingAdmissionPolicy decides</title>
  <desc id="desc">A request to create or update a Service matches the policy no-nodeport through matchConstraints. The binding no-nodeport-outpost selects the namespace, and the API server evaluates the CEL expression. If the expression is true, the request is admitted. If it is false and the action is Deny, the request is rejected with the message of the policy.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M320 64 V100" marker-end="url(#arrow)"/>
  <path class="line" d="M320 146 V182" marker-end="url(#arrow)"/>
  <path class="line" d="M558 168 H326"/>
  <path class="okline" d="M220 244 V318" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M440 244 V318" marker-end="url(#arrowbad)"/>
  <text class="code" x="332" y="87">matchConstraints</text>
  <text class="label" x="308" y="170" text-anchor="end">binding selects namespace</text>
  <text class="label good" x="208" y="286" text-anchor="end">true</text>
  <text class="label bad" x="452" y="286">false, action Deny</text>

  <rect class="box" x="200" y="20" width="240" height="44" rx="8"/>
  <text x="320" y="47" text-anchor="middle">Create or update Service</text>
  <rect class="ask" x="200" y="102" width="240" height="44" rx="8"/>
  <text x="320" y="129" text-anchor="middle">policy <tspan class="code">no-nodeport</tspan></text>
  <rect class="policy" x="560" y="138" width="250" height="60" rx="8"/>
  <text x="685" y="163" text-anchor="middle">binding</text>
  <text class="code" x="685" y="184" text-anchor="middle">no-nodeport-outpost</text>
  <rect class="ask" x="150" y="184" width="340" height="60" rx="8"/>
  <text x="320" y="208" text-anchor="middle">Evaluate CEL expression</text>
  <text class="code" x="320" y="230" text-anchor="middle">object.spec.type != 'NodePort'</text>
  <rect class="ok" x="120" y="320" width="200" height="50" rx="8"/>
  <text x="220" y="350" text-anchor="middle">Admitted</text>
  <rect class="drop" x="340" y="320" width="260" height="50" rx="8"/>
  <text x="470" y="350" text-anchor="middle">Rejected with message</text>
</svg>
