apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-03-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: fails-closed
    description: The webhook image-review uses failurePolicy Fail and a matching Pod is rejected when the webhook is unreachable
    type: file
    source: validation/validate-fails-closed.sh
    points: 1
  - name: timeout-bounded
    description: Every webhook in image-review has timeoutSeconds between 1 and 10
    type: file
    source: validation/validate-timeout-bounded.sh
    points: 1
  - name: skips-system
    description: The namespaceSelector of image-review leaves out kube-system and still selects the starfleet namespace
    type: file
    source: validation/validate-skips-system.sh
    points: 1
