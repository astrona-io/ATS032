apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-030-03-03
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: image-review
webhooks:
- name: image-review.astrona.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  timeoutSeconds: 30
  clientConfig:
    service:
      name: image-review
      namespace: starfleet-032-030-03-03
      path: /validate
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
  objectSelector:
    matchLabels:
      review: image
