apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-03-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    preloadImages:
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: enforce-baseline
    description: The namespace enforces the baseline Pod Security Standard and rejects a privileged Pod
    type: file
    source: validation/validate-enforce-baseline.sh
    points: 1
  - name: warn-restricted
    description: The namespace warns about Pods that break the restricted Pod Security Standard
    type: file
    source: validation/validate-warn-restricted.sh
    points: 1
  - name: web-runs
    description: The web Deployment runs all its replicas without privileged containers
    type: file
    source: validation/validate-web-runs.sh
    points: 1
