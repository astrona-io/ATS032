apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: outpost-032-030-03-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - echo web started; sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
