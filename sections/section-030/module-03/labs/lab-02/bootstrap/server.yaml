apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: guard
    namespace: webhook-system
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: guard
    template:
      metadata:
        labels:
          app: guard
      spec:
        containers:
        - name: server
          image: python:3.13-alpine
          command:
          - python3
          - /code/server.py
          ports:
          - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 1
          volumeMounts:
          - name: code
            mountPath: /code
          - name: tls
            mountPath: /tls
            readOnly: true
        volumes:
        - name: code
          configMap:
            name: guard-code
        - name: tls
          secret:
            secretName: guard-tls
- apiVersion: v1
  kind: Service
  metadata:
    name: guard
    namespace: webhook-system
  spec:
    selector:
      app: guard
    ports:
    - port: 443
      targetPort: 8443
