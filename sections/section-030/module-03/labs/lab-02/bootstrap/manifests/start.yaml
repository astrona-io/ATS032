apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-030-03-02
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-032-030-03-02
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: outpost-032-030-03-02
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-nodeport
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["services"]
  validations:
  - expression: "object.spec.type != 'NodePort'"
    message: "NodePort Services are not allowed in this namespace"
