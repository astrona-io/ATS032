apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-030-01-01
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-032-030-01-01
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: outpost-032-030-01-01
spec:
  selector:
    app: relay
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: probe-key
  namespace: starfleet-032-030-01-01
stringData:
  key: not-for-the-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-032-030-01-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - -m
        - http.server
        - "8080"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-032-030-01-01
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
