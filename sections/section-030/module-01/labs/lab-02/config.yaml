apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-030-01-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    preloadImages:
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: kubelet-config-hardened
    description: The worker kubelet runs with anonymous authentication off, Webhook authorization and no read-only port
    type: file
    source: validation/validate-kubelet-config-hardened.sh
    points: 1
  - name: kubelet-anon-rejected
    description: An anonymous request to port 10250 of the worker gets 401 and port 10255 refuses connections
    type: file
    source: validation/validate-kubelet-anon-rejected.sh
    points: 1
  - name: worker-node-ready
    description: The worker is Ready with the hardened kubelet and the API server still reads Pod logs from it
    type: file
    source: validation/validate-worker-node-ready.sh
    points: 1
