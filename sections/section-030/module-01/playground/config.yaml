apiVersion: astrona.io/v1
metadata:
  name: ats-032-playground-030-01
  docs:
    guide: docs/overview.md
# A real kubeadm node, so the readings can read the kubelet configuration file
# and the static Pod manifests and restart the kubelet on the host.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 20
    display: false
bootstrap:
  init:
  - name: create-kubeadm-cluster
    description: Creates the single-node kubeadm cluster and the example workloads in starfleet and outpost
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
