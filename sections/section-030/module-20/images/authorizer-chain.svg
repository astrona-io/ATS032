<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" role="img" aria-labelledby="title desc">
  <title id="title">The authorizer chain for Node,RBAC</title>
  <desc id="desc">An authenticated request goes first to the Node authorizer. If Node allows it, the request is authorized. If Node has no opinion, RBAC is asked. If RBAC allows it, the request is authorized. If no rule allows it, the API server returns 403 Forbidden.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 110 H258" marker-end="url(#arrow)"/>
  <path class="line" d="M400 110 H518" marker-end="url(#arrow)"/>
  <path class="okline" d="M330 138 V200 H508" marker-end="url(#arrowok)"/>
  <path class="okline" d="M590 138 V172" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M660 110 H728" marker-end="url(#arrowbad)"/>
  <text class="label" x="224" y="98" text-anchor="middle">first</text>
  <text class="label" x="459" y="98" text-anchor="middle">no opinion</text>
  <text class="label good" x="342" y="190">allow</text>
  <text class="label good" x="602" y="160">allow</text>
  <text class="label bad" x="694" y="98" text-anchor="middle">no rule</text>

  <rect class="box" x="30" y="82" width="160" height="56" rx="8"/>
  <text x="110" y="107" text-anchor="middle">Authenticated</text>
  <text x="110" y="126" text-anchor="middle">request</text>

  <rect class="ask" x="260" y="82" width="140" height="56" rx="8"/>
  <text class="code" x="330" y="115" text-anchor="middle">Node</text>

  <rect class="ask" x="520" y="82" width="140" height="56" rx="8"/>
  <text class="code" x="590" y="115" text-anchor="middle">RBAC</text>

  <rect class="ok" x="510" y="174" width="160" height="52" rx="8"/>
  <text x="590" y="205" text-anchor="middle">Authorized</text>

  <rect class="drop" x="730" y="82" width="90" height="56" rx="8"/>
  <text class="code" x="775" y="107" text-anchor="middle">403</text>
  <text x="775" y="126" text-anchor="middle">Forbidden</text>
</svg>
