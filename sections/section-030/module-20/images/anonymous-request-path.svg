<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">The path of a request without a credential</title>
  <desc id="desc">When anonymous-auth is true, a request without a credential becomes the user system:anonymous in the group system:unauthenticated. Authorization then looks for bindings. With only system:public-info-viewer, the caller gets 200 on the health and version paths. With a broad binding as well, the caller gets 200 on cluster data.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 180 H258" marker-end="url(#arrow)"/>
  <path class="line" d="M460 180 H518" marker-end="url(#arrow)"/>
  <path class="okline" d="M620 150 V108" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M620 210 V252" marker-end="url(#arrowbad)"/>
  <text class="label good" x="632" y="134">only public-info-viewer</text>
  <text class="label bad" x="632" y="236">plus a broad binding</text>

  <rect class="box" x="30" y="152" width="170" height="56" rx="8"/>
  <text x="115" y="177" text-anchor="middle">Request without</text>
  <text x="115" y="196" text-anchor="middle">credential</text>

  <rect class="box" x="260" y="140" width="200" height="80" rx="8"/>
  <text class="code" x="360" y="172" text-anchor="middle">system:anonymous</text>
  <text class="code" x="360" y="196" text-anchor="middle">system:unauthenticated</text>

  <rect class="ask" x="520" y="152" width="200" height="56" rx="8"/>
  <text x="620" y="185" text-anchor="middle">Authorization</text>

  <rect class="ok" x="470" y="50" width="300" height="56" rx="8"/>
  <text x="620" y="83" text-anchor="middle"><tspan class="code">200</tspan> on health and version paths</text>

  <rect class="drop" x="470" y="254" width="300" height="56" rx="8"/>
  <text x="620" y="287" text-anchor="middle"><tspan class="code">200</tspan> on cluster data</text>
</svg>
