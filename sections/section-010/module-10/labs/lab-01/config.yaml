apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-010-01-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-rbac
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pod-reader-role
    description: The Role pod-reader in starfleet-032-010-01-01 allows exactly get, list and watch on Pods
    type: file
    source: validation/validate-pod-reader-role.sh
    points: 1
  - name: shuttle-binding
    description: shuttle-pod-reader gives pod-reader to shuttle only, and shuttle holds no other grant
    type: file
    source: validation/validate-shuttle-binding.sh
    points: 1
