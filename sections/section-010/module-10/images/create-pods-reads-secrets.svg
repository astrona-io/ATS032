<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Creating a pod is a path to reading Secrets</title>
  <desc id="desc">An identity may create pods but may not get secrets. Its direct get request on a Secret is denied. It creates a pod that mounts the Secret as a volume, and the Secret data can be read from inside the container.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="300" y="16" width="520" height="300" rx="10"/>
  <text class="label" x="316" y="38">one namespace</text>

  <path class="dashed" d="M210 140 L598 78" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="390" y="96" text-anchor="middle">get secrets: denied</text>
  <path class="okline" d="M210 195 L358 248" marker-end="url(#arrowok)"/>
  <text class="label good" x="288" y="262" text-anchor="end">create pod: allowed</text>
  <path class="okline" d="M690 102 V250 H562" marker-end="url(#arrowok)"/>
  <text class="label good" x="702" y="180">volume mount</text>

  <rect class="box" x="20" y="125" width="190" height="90" rx="8"/>
  <text class="strong" x="115" y="150" text-anchor="middle">identity</text>
  <text x="34" y="176">may: <tspan class="code">create pods</tspan></text>
  <text x="34" y="200">may not: <tspan class="code">get secrets</tspan></text>

  <rect class="policy" x="600" y="52" width="180" height="50" rx="8"/>
  <text x="690" y="82" text-anchor="middle">Secret</text>

  <rect class="ok" x="360" y="222" width="200" height="56" rx="8"/>
  <text x="460" y="245" text-anchor="middle">new Pod</text>
  <text class="label" x="460" y="266" text-anchor="middle">mounts the Secret</text>
  <text class="label" x="460" y="302" text-anchor="middle">the container reads the Secret data</text>
</svg>
