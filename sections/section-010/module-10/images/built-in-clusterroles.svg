<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="title desc">
  <title id="title">The four built-in user ClusterRoles</title>
  <desc id="desc">From narrow to broad: view gives read-only access to most objects without Secrets and without Roles or RoleBindings. edit adds writes, includes Secrets and can run workloads as any ServiceAccount of the namespace, but cannot change Roles. admin adds Roles and RoleBindings in the namespace. cluster-admin allows every action on every resource.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M95 26 H745" marker-end="url(#arrow)"/>
  <text class="label" x="30" y="31">narrow</text>
  <text class="label" x="810" y="31" text-anchor="end">broad</text>

  <rect class="ok" x="30" y="56" width="180" height="200" rx="8"/>
  <text class="code strong" x="120" y="84" text-anchor="middle">view</text>
  <text x="46" y="116">read-only access</text>
  <text x="46" y="138">to most objects</text>
  <text class="good strong" x="46" y="166">no Secrets</text>
  <text x="46" y="194">no Roles or</text>
  <text x="46" y="216">RoleBindings</text>

  <rect class="ask" x="230" y="56" width="180" height="200" rx="8"/>
  <text class="code strong" x="320" y="84" text-anchor="middle">edit</text>
  <text x="246" y="116">read and write</text>
  <text x="246" y="138">most objects</text>
  <text class="bad strong" x="246" y="166">includes Secrets</text>
  <text x="246" y="194">runs as any</text>
  <text x="246" y="216">ServiceAccount</text>
  <text x="246" y="238">no Role changes</text>

  <rect class="ask" x="430" y="56" width="180" height="200" rx="8"/>
  <text class="code strong" x="520" y="84" text-anchor="middle">admin</text>
  <text x="446" y="116">all of <tspan class="code">edit</tspan></text>
  <text class="bad strong" x="446" y="144">includes Secrets</text>
  <text x="446" y="172">plus Roles and</text>
  <text x="446" y="194">RoleBindings in</text>
  <text x="446" y="216">the namespace</text>

  <rect class="drop" x="630" y="56" width="180" height="200" rx="8"/>
  <text class="code strong" x="720" y="84" text-anchor="middle">cluster-admin</text>
  <text x="646" y="116">every action on</text>
  <text x="646" y="138">every resource</text>
  <text x="646" y="172">with a</text>
  <text x="646" y="194"><tspan class="code">ClusterRoleBinding</tspan>:</text>
  <text x="646" y="216">full cluster control</text>
</svg>
