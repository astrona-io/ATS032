<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-labelledby="title desc">
  <title id="title">The configmap-reader grant and its limits</title>
  <desc id="desc">The RoleBinding shuttle-configmap-reader in the outpost namespace names the Role configmap-reader and the subject shuttle, a ServiceAccount in the starfleet namespace. As shuttle, list configmaps in outpost is allowed. Delete configmaps in outpost, list configmaps in starfleet and list secrets in outpost are denied.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="14" y="40" width="176" height="120" rx="10"/>
  <text class="label" x="26" y="60">namespace <tspan class="code">starfleet</tspan></text>
  <rect class="frame" x="250" y="40" width="290" height="250" rx="10"/>
  <text class="label" x="264" y="60">namespace <tspan class="code">outpost</tspan></text>

  <path class="line" d="M263 107 H180" marker-end="url(#arrow)"/>
  <text class="label" x="221" y="98" text-anchor="middle">subject</text>
  <path class="line" d="M390 136 V196" marker-end="url(#arrow)"/>
  <text class="label" x="400" y="171">roleRef</text>

  <rect class="box" x="28" y="78" width="150" height="56" rx="8"/>
  <text x="103" y="100" text-anchor="middle">ServiceAccount</text>
  <text class="code" x="103" y="122" text-anchor="middle">shuttle</text>
  <rect class="box" x="265" y="80" width="250" height="56" rx="8"/>
  <text x="390" y="102" text-anchor="middle">RoleBinding</text>
  <text class="code" x="390" y="124" text-anchor="middle">shuttle-configmap-reader</text>
  <rect class="policy" x="265" y="200" width="250" height="70" rx="8"/>
  <text x="390" y="224" text-anchor="middle">Role <tspan class="code">configmap-reader</tspan></text>
  <text class="code" x="390" y="252" text-anchor="middle">get, list on configmaps</text>

  <text class="label" x="560" y="46">Asked as <tspan class="code">shuttle</tspan></text>
  <rect class="ok" x="560" y="60" width="250" height="40" rx="8"/>
  <text class="code" x="685" y="85" text-anchor="middle">list configmaps -n outpost</text>
  <text class="strong good" x="820" y="85">yes</text>
  <rect class="drop" x="560" y="112" width="250" height="40" rx="8"/>
  <text class="code" x="685" y="137" text-anchor="middle">delete configmaps -n outpost</text>
  <text class="strong bad" x="820" y="137">no</text>
  <rect class="drop" x="560" y="164" width="250" height="40" rx="8"/>
  <text class="code" x="685" y="189" text-anchor="middle">list configmaps -n starfleet</text>
  <text class="strong bad" x="820" y="189">no</text>
  <rect class="drop" x="560" y="216" width="250" height="40" rx="8"/>
  <text class="code" x="685" y="241" text-anchor="middle">list secrets -n outpost</text>
  <text class="strong bad" x="820" y="241">no</text>
</svg>
