<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">How the API server authorizes a request</title>
  <desc id="desc">A request first passes authentication, which sets the user and the groups. The RBAC authorizer then compares the verb, resource and namespace with the rules of every binding that applies. If one rule matches, the request is allowed. If no rule matches, the API server answers 403 Forbidden.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="228" y="16" width="602" height="262" rx="10"/>
  <text class="label" x="244" y="36" ><tspan class="code">kube-apiserver</tspan></text>

  <path class="line" d="M120 75 H248" marker-end="url(#arrow)"/>
  <text class="label" x="172" y="64" text-anchor="middle">user, groups</text>
  <path class="line" d="M410 75 H528" marker-end="url(#arrow)"/>
  <text class="label" x="469" y="52" text-anchor="middle">verb, resource,</text>
  <text class="label" x="469" y="66" text-anchor="middle">namespace</text>
  <path class="okline" d="M590 100 L532 196" marker-end="url(#arrowok)"/>
  <text class="label good" x="548" y="152" text-anchor="end">a rule matches</text>
  <path class="dashed" d="M650 100 L728 196" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="708" y="152">no rule matches</text>

  <rect class="box" x="20" y="50" width="100" height="50" rx="8"/>
  <text x="70" y="80" text-anchor="middle">Request</text>
  <rect class="box" x="250" y="50" width="160" height="50" rx="8"/>
  <text x="330" y="80" text-anchor="middle">Authentication</text>
  <rect class="ask" x="530" y="50" width="180" height="50" rx="8"/>
  <text x="620" y="80" text-anchor="middle">RBAC authorizer</text>
  <rect class="ok" x="440" y="200" width="160" height="50" rx="8"/>
  <text x="520" y="230" text-anchor="middle">Allowed</text>
  <rect class="drop" x="650" y="200" width="160" height="50" rx="8"/>
  <text class="code" x="730" y="230" text-anchor="middle">403 Forbidden</text>
</svg>
