<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">One ClusterRole, three reaches</title>
  <desc id="desc">The ClusterRole view is one definition. A RoleBinding in outpost gives its read access only in outpost. A RoleBinding in starfleet gives it only in starfleet. A ClusterRoleBinding gives it in every namespace.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="25" y="128" width="250" height="220" rx="10"/>
  <text class="label" x="39" y="338">namespace <tspan class="code">outpost</tspan></text>
  <rect class="frame" x="295" y="128" width="250" height="220" rx="10"/>
  <text class="label" x="309" y="338">namespace <tspan class="code">starfleet</tspan></text>
  <text class="label" x="584" y="338">whole cluster</text>

  <path class="line" d="M380 80 L200 148" marker-end="url(#arrow)"/>
  <path class="line" d="M420 80 V148" marker-end="url(#arrow)"/>
  <path class="line" d="M460 80 L720 148" marker-end="url(#arrow)"/>
  <path class="okline" d="M150 200 V258" marker-end="url(#arrowok)"/>
  <path class="okline" d="M420 200 V258" marker-end="url(#arrowok)"/>
  <path class="line" d="M690 200 V258" marker-end="url(#arrow)"/>

  <rect class="box" x="320" y="30" width="200" height="50" rx="8"/>
  <text x="420" y="60" text-anchor="middle">ClusterRole <tspan class="code">view</tspan></text>

  <rect class="box" x="45" y="150" width="210" height="50" rx="8"/>
  <text x="150" y="180" text-anchor="middle">RoleBinding</text>
  <rect class="box" x="315" y="150" width="210" height="50" rx="8"/>
  <text x="420" y="180" text-anchor="middle">RoleBinding</text>
  <rect class="box" x="580" y="150" width="220" height="50" rx="8"/>
  <text x="690" y="180" text-anchor="middle">ClusterRoleBinding</text>

  <rect class="ok" x="45" y="260" width="210" height="50" rx="8"/>
  <text x="150" y="290" text-anchor="middle">read in <tspan class="code">outpost</tspan> only</text>
  <rect class="ok" x="315" y="260" width="210" height="50" rx="8"/>
  <text x="420" y="290" text-anchor="middle">read in <tspan class="code">starfleet</tspan> only</text>
  <rect class="ask" x="580" y="260" width="220" height="50" rx="8"/>
  <text x="690" y="290" text-anchor="middle">read in every namespace</text>
</svg>
