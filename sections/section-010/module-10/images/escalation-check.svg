<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">The escalation check of the API server</title>
  <desc id="desc">shuttle may create Roles in outpost and holds get on configmaps there. It asks the API server to store two Roles. copy-reader asks for get on configmaps, which shuttle holds, so the API server stores it. secret-reader asks for get on secrets, which shuttle does not hold, so the API server answers Forbidden.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M220 175 H348" marker-end="url(#arrow)"/>
  <text class="label" x="284" y="165" text-anchor="middle">create Role</text>
  <path class="okline" d="M550 150 L618 92" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M550 200 L618 258" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="105" width="200" height="140" rx="8"/>
  <text x="120" y="130" text-anchor="middle">ServiceAccount <tspan class="code">shuttle</tspan></text>
  <text class="label" x="36" y="160">holds in <tspan class="code">outpost</tspan>:</text>
  <text class="code" x="36" y="184">get configmaps</text>
  <text class="code" x="36" y="206">create roles,</text>
  <text class="code" x="36" y="226">rolebindings</text>

  <rect class="ask" x="350" y="115" width="200" height="120" rx="8"/>
  <text class="strong" x="450" y="142" text-anchor="middle">API server</text>
  <text x="450" y="170" text-anchor="middle">is every permission</text>
  <text x="450" y="192" text-anchor="middle">in the new Role</text>
  <text x="450" y="214" text-anchor="middle">already held?</text>

  <rect class="ok" x="620" y="30" width="200" height="86" rx="8"/>
  <text class="code strong" x="720" y="56" text-anchor="middle">copy-reader</text>
  <text class="code" x="720" y="80" text-anchor="middle">get configmaps</text>
  <text class="good" x="720" y="104" text-anchor="middle">held, so stored</text>

  <rect class="drop" x="620" y="234" width="200" height="86" rx="8"/>
  <text class="code strong" x="720" y="260" text-anchor="middle">secret-reader</text>
  <text class="code" x="720" y="284" text-anchor="middle">get secrets</text>
  <text class="bad" x="720" y="308" text-anchor="middle">not held: <tspan class="code">Forbidden</tspan></text>
</svg>
