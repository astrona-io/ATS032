<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Every binding that reaches shuttle adds rules</title>
  <desc id="desc">Bindings can name the ServiceAccount shuttle directly or one of the groups it belongs to automatically: system:serviceaccounts:starfleet, system:serviceaccounts and system:authenticated. The RBAC authorizer adds the rules of all of them into one effective permission. No rule subtracts.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="label" x="20" y="22">bindings whose subject is</text>
  <path class="line" d="M320 57 L418 140" marker-end="url(#arrow)"/>
  <path class="line" d="M320 123 L418 152" marker-end="url(#arrow)"/>
  <path class="line" d="M320 189 L418 168" marker-end="url(#arrow)"/>
  <path class="line" d="M320 255 L418 180" marker-end="url(#arrow)"/>
  <path class="okline" d="M590 160 H658" marker-end="url(#arrowok)"/>

  <rect class="box" x="20" y="30" width="300" height="54" rx="8"/>
  <text x="170" y="52" text-anchor="middle">ServiceAccount</text>
  <text class="code" x="170" y="73" text-anchor="middle">shuttle</text>
  <rect class="box" x="20" y="96" width="300" height="54" rx="8"/>
  <text x="170" y="118" text-anchor="middle">Group</text>
  <text class="code" x="170" y="139" text-anchor="middle">system:serviceaccounts:starfleet</text>
  <rect class="box" x="20" y="162" width="300" height="54" rx="8"/>
  <text x="170" y="184" text-anchor="middle">Group</text>
  <text class="code" x="170" y="205" text-anchor="middle">system:serviceaccounts</text>
  <rect class="box" x="20" y="228" width="300" height="54" rx="8"/>
  <text x="170" y="250" text-anchor="middle">Group</text>
  <text class="code" x="170" y="271" text-anchor="middle">system:authenticated</text>

  <rect class="ask" x="420" y="120" width="170" height="80" rx="8"/>
  <text x="505" y="155" text-anchor="middle">RBAC authorizer</text>
  <text class="label" x="505" y="178" text-anchor="middle">adds all rules up</text>

  <rect class="ok" x="660" y="120" width="160" height="80" rx="8"/>
  <text x="740" y="155" text-anchor="middle">effective</text>
  <text x="740" y="177" text-anchor="middle">permission</text>
  <text class="label" x="740" y="228" text-anchor="middle">nothing subtracts</text>
</svg>
