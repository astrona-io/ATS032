apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-010-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-rbac
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-repair
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pod-reader-role
    description: Role pod-reader grants only get, list and watch on core Pods
    type: file
    source: validation/validate-pod-reader-role.sh
    points: 1
  - name: shuttle-binding
    description: RoleBinding shuttle-pod-reader gives the Role to shuttle only, and shuttle can read Pods
    type: file
    source: validation/validate-shuttle-binding.sh
    points: 1
