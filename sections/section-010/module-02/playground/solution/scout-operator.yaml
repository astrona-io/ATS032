apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scout-operator
  namespace: outpost
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - scout-report
  verbs:
  - get
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scout-operator
  namespace: outpost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scout-operator
subjects:
- kind: ServiceAccount
  name: scout
  namespace: starfleet
