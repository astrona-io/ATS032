apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-010-02-01
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-032-010-02-01
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet-032-010-02-01
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet-032-010-02-01
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-report
  namespace: outpost-032-010-02-01
data:
  status: pending
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scout-edit-everywhere
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: scout
    namespace: starfleet-032-010-02-01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: outpost-032-010-02-01
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shuttle-configmap-reader
  namespace: outpost-032-010-02-01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-reader
subjects:
  - kind: ServiceAccount
    name: shuttle
    namespace: starfleet-032-010-02-01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crew-view
  namespace: outpost-032-010-02-01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: starfleet-crew
    apiGroup: rbac.authorization.k8s.io
