apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-010-02-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-rbac
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: scout-operator-role
    description: The Role scout-operator allows exactly Pod reads and get, update and patch on the ConfigMap scout-report
    type: file
    source: validation/validate-scout-operator-role.sh
    points: 1
  - name: scout-operator-binding
    description: The RoleBinding scout-operator gives scout-operator to scout only
    type: file
    source: validation/validate-scout-operator-binding.sh
    points: 1
  - name: cluster-grant-removed
    description: scout holds only the scout-operator rules, and no other binding names scout
    type: file
    source: validation/validate-cluster-grant-removed.sh
    points: 1
