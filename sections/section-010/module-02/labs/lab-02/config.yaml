apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-010-02-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-rbac
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: authenticated-grant-removed
    description: No binding outside the built-in ones gives access to system:authenticated or system:unauthenticated
    type: file
    source: validation/validate-authenticated-grant-removed.sh
    points: 1
  - name: serviceaccount-grants-removed
    description: No binding outside the built-in ones gives access to a whole group of ServiceAccounts
    type: file
    source: validation/validate-serviceaccount-grants-removed.sh
    points: 1
