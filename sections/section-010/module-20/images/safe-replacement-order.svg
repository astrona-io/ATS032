<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-labelledby="title desc">
  <title id="title">The safe order to replace a broad grant</title>
  <desc id="desc">At the start the group starfleet-crew holds view through crew-view. Then crew-pod-reader is added, and the crew holds both grants. Then crew-view is deleted, and the crew keeps reading Pods and their logs, while Services and other namespaces are denied.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M262 160 H288" marker-end="url(#arrow)"/>
  <path class="line" d="M532 160 H558" marker-end="url(#arrow)"/>
  <rect class="frame" x="20" y="50" width="242" height="250" rx="10"/>
  <text class="strong" x="141" y="38" text-anchor="middle">1. Start</text>
  <rect class="frame" x="290" y="50" width="242" height="250" rx="10"/>
  <text class="strong" x="411" y="38" text-anchor="middle">2. Add the narrow grant</text>
  <rect class="frame" x="560" y="50" width="242" height="250" rx="10"/>
  <text class="strong" x="681" y="38" text-anchor="middle">3. Delete <tspan class="code">crew-view</tspan></text>
  <rect class="ask" x="36" y="70" width="210" height="56" rx="8"/>
  <text x="141" y="93" text-anchor="middle"><tspan class="code">crew-view</tspan></text>
  <text class="label" x="141" y="113" text-anchor="middle">view: much more than needed</text>
  <rect class="ask" x="306" y="70" width="210" height="56" rx="8"/>
  <text x="411" y="93" text-anchor="middle"><tspan class="code">crew-view</tspan></text>
  <text class="label" x="411" y="113" text-anchor="middle">view: much more than needed</text>
  <rect class="ok" x="306" y="140" width="210" height="56" rx="8"/>
  <text x="411" y="163" text-anchor="middle"><tspan class="code">crew-pod-reader</tspan></text>
  <text class="label" x="411" y="183" text-anchor="middle">pods, pods/log: read</text>
  <rect class="drop" x="576" y="70" width="210" height="56" rx="8"/>
  <text x="681" y="93" text-anchor="middle"><tspan class="code">crew-view</tspan></text>
  <text class="label bad" x="681" y="113" text-anchor="middle">deleted</text>
  <rect class="ok" x="576" y="140" width="210" height="56" rx="8"/>
  <text x="681" y="163" text-anchor="middle"><tspan class="code">crew-pod-reader</tspan></text>
  <text class="label" x="681" y="183" text-anchor="middle">pods, pods/log: read</text>
  <text x="141" y="240" text-anchor="middle">Crew can read Pods.</text>
  <text class="label bad" x="141" y="262" text-anchor="middle">Services: yes</text>
  <text x="411" y="240" text-anchor="middle">Crew can read Pods.</text>
  <text class="label" x="411" y="262" text-anchor="middle">Old grant hides mistakes</text>
  <text class="label good" x="681" y="230" text-anchor="middle">Pods and logs: yes</text>
  <text class="label good" x="681" y="252" text-anchor="middle">Services: no</text>
  <text class="label good" x="681" y="274" text-anchor="middle">Other namespaces: no</text>
</svg>
