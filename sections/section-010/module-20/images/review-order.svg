<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-labelledby="title desc">
  <title id="title">The order of an access review</title>
  <desc id="desc">An access review goes from the identity to all its names, then to the bindings that name them, to the roles behind each binding, to the effective access, and then to findings by comparing that access with the real need.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M220 70 H308" marker-end="url(#arrow)"/>
  <path class="line" d="M490 70 H578" marker-end="url(#arrow)"/>
  <path class="line" d="M670 100 V135 H130 V168" marker-end="url(#arrow)"/>
  <path class="line" d="M220 200 H308" marker-end="url(#arrow)"/>
  <path class="line" d="M490 200 H578" marker-end="url(#arrow)"/>
  <rect class="box" x="40" y="40" width="180" height="60" rx="8"/>
  <text x="130" y="66" text-anchor="middle">Identity</text>
  <text class="label" x="130" y="86" text-anchor="middle"><tspan class="code">scout</tspan></text>
  <rect class="box" x="310" y="40" width="180" height="60" rx="8"/>
  <text x="400" y="66" text-anchor="middle">All its names</text>
  <text class="label" x="400" y="86" text-anchor="middle">user and groups</text>
  <rect class="box" x="580" y="40" width="180" height="60" rx="8"/>
  <text x="670" y="66" text-anchor="middle">Bindings</text>
  <text class="label" x="670" y="86" text-anchor="middle">search the lists</text>
  <rect class="box" x="40" y="170" width="180" height="60" rx="8"/>
  <text x="130" y="196" text-anchor="middle">Roles</text>
  <text class="label" x="130" y="216" text-anchor="middle">follow <tspan class="code">roleRef</tspan></text>
  <rect class="box" x="310" y="170" width="180" height="60" rx="8"/>
  <text x="400" y="196" text-anchor="middle">Effective access</text>
  <text class="label" x="400" y="216" text-anchor="middle">read the rules</text>
  <rect class="ask" x="580" y="170" width="180" height="60" rx="8"/>
  <text x="670" y="196" text-anchor="middle">Findings</text>
  <text class="label" x="670" y="216" text-anchor="middle">compare with need</text>
</svg>
