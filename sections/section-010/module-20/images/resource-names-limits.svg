<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" role="img" aria-labelledby="title desc">
  <title id="title">What resourceNames can and cannot limit</title>
  <desc id="desc">resourceNames limits get, update and patch to the named object. It limits list and watch only when the request uses a field selector on metadata.name. A create request has no name yet, so a rule with resourceNames never matches it. deletecollection cannot be limited by name.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="strong" x="30" y="36" text-anchor="start">A rule with <tspan class="code">resourceNames: ["scout-report"]</tspan></text>
  <rect class="ok" x="30" y="56" width="200" height="48" rx="8"/>
  <text x="130" y="85" text-anchor="middle"><tspan class="code">get, update, patch</tspan></text>
  <text x="256" y="85" text-anchor="start">Limited to the named object.</text>
  <rect class="ask" x="30" y="124" width="200" height="48" rx="8"/>
  <text x="130" y="153" text-anchor="middle"><tspan class="code">list, watch</tspan></text>
  <text x="256" y="153" text-anchor="start">Limited only with a field selector on <tspan class="code">metadata.name</tspan>.</text>
  <rect class="drop" x="30" y="192" width="200" height="48" rx="8"/>
  <text x="130" y="221" text-anchor="middle"><tspan class="code">create</tspan></text>
  <text x="256" y="221" text-anchor="start">No name yet, so the rule never matches. Stays denied.</text>
  <rect class="drop" x="30" y="260" width="200" height="48" rx="8"/>
  <text x="130" y="289" text-anchor="middle"><tspan class="code">deletecollection</tspan></text>
  <text x="256" y="289" text-anchor="start">Cannot be limited by name.</text>
</svg>
