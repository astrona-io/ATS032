<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Subresource flag compared with a resource name</title>
  <desc id="desc">In kubectl auth can-i, create pods/exec is read as a question about the Pod named exec. create pods --subresource=exec asks about the exec subresource of Pods.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="150" x2="810" y2="150"/>
  <text class="strong" x="30" y="38" text-anchor="start">Written with a slash</text>
  <path class="dashed" d="M290 82 H388" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="340" y="72" text-anchor="middle">read as</text>
  <rect class="box" x="30" y="56" width="260" height="52" rx="8"/>
  <text x="160" y="87" text-anchor="middle"><tspan class="code">create pods/exec</tspan></text>
  <rect class="drop" x="392" y="56" width="200" height="52" rx="8"/>
  <text x="492" y="80" text-anchor="middle">the Pod named <tspan class="code">exec</tspan></text>
  <text class="label" x="492" y="99" text-anchor="middle">resource name</text>
  <text x="612" y="78" text-anchor="start">Not the question you meant.</text>
  <text x="612" y="98" text-anchor="start">The answer can mislead you.</text>
  <text class="strong" x="30" y="188" text-anchor="start">Written with the flag</text>
  <path class="okline" d="M290 232 H388" marker-end="url(#arrowok)"/>
  <text class="label good" x="340" y="222" text-anchor="middle">read as</text>
  <rect class="box" x="30" y="206" width="260" height="52" rx="8"/>
  <text x="160" y="237" text-anchor="middle"><tspan class="code">create pods --subresource=exec</tspan></text>
  <rect class="ok" x="392" y="206" width="200" height="52" rx="8"/>
  <text x="492" y="230" text-anchor="middle">the <tspan class="code">exec</tspan> subresource</text>
  <text class="label" x="492" y="249" text-anchor="middle">of Pods</text>
  <text x="612" y="228" text-anchor="start">The rule for <tspan class="code">pods/exec</tspan></text>
  <text x="612" y="248" text-anchor="start">is what gets checked.</text>
</svg>
