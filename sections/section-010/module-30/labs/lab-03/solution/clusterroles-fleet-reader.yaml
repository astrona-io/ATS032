apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-reader-pods
  labels:
    fleet.example.com/aggregate-to-fleet-reader: "true"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-reader-services
  labels:
    fleet.example.com/aggregate-to-fleet-reader: "true"
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-reader
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        fleet.example.com/aggregate-to-fleet-reader: "true"
