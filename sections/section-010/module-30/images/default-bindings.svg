<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Default bindings to broad groups</title>
  <desc id="desc">The group system:masters is bound to cluster-admin, which gives full control, and the API server re-creates that binding at startup. The group system:authenticated is bound to system:basic-user, system:discovery and system:public-info-viewer. The group system:unauthenticated is bound only to system:public-info-viewer.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M250 52 L518 42" marker-end="url(#arrow)"/>
  <path class="okline" d="M250 172 L518 132" marker-end="url(#arrowok)"/>
  <path class="okline" d="M250 172 L518 192" marker-end="url(#arrowok)"/>
  <path class="okline" d="M250 172 L518 252" marker-end="url(#arrowok)"/>
  <path class="okline" d="M250 282 L518 252" marker-end="url(#arrowok)"/>

  <text class="label" x="30" y="20">Groups</text>
  <rect class="box" x="30" y="30" width="220" height="44" rx="8"/>
  <text class="code" x="140" y="57" text-anchor="middle">system:masters</text>
  <rect class="box" x="30" y="150" width="220" height="44" rx="8"/>
  <text class="code" x="140" y="177" text-anchor="middle">system:authenticated</text>
  <rect class="box" x="30" y="260" width="220" height="44" rx="8"/>
  <text class="code" x="140" y="287" text-anchor="middle">system:unauthenticated</text>

  <text class="label" x="520" y="12">ClusterRoles</text>
  <rect class="drop" x="520" y="20" width="270" height="44" rx="8"/>
  <text class="code" x="655" y="47" text-anchor="middle">cluster-admin</text>
  <text class="label bad" x="520" y="84">full control, binding re-created at startup</text>
  <rect class="ok" x="520" y="110" width="270" height="44" rx="8"/>
  <text class="code" x="655" y="137" text-anchor="middle">system:basic-user</text>
  <rect class="ok" x="520" y="170" width="270" height="44" rx="8"/>
  <text class="code" x="655" y="197" text-anchor="middle">system:discovery</text>
  <rect class="ok" x="520" y="230" width="270" height="44" rx="8"/>
  <text class="code" x="655" y="257" text-anchor="middle">system:public-info-viewer</text>
  <text class="label good" x="520" y="296">small read-only roles</text>
</svg>
