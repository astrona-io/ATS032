<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Checks for outpost-crew before and after the change</title>
  <desc id="desc">Six kubectl auth can-i checks for the group outpost-crew in outpost. With the wildcard Role, all six print yes. With the explicit Role, list pods and delete configmaps still print yes, and get secrets, delete pods, create pods/exec and create rolebindings print no.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="56" x2="810" y2="56"/>
  <line class="sep" x1="30" y1="96" x2="810" y2="96"/>
  <line class="sep" x1="30" y1="136" x2="810" y2="136"/>
  <line class="sep" x1="30" y1="176" x2="810" y2="176"/>
  <line class="sep" x1="30" y1="216" x2="810" y2="216"/>
  <line class="sep" x1="30" y1="256" x2="810" y2="256"/>

  <text class="label" x="30" y="40">Check for <tspan class="code">outpost-crew</tspan></text>
  <text class="label" x="540" y="40" text-anchor="middle">Wildcard Role</text>
  <text class="label" x="710" y="40" text-anchor="middle">Explicit Role</text>

  <text class="code" x="30" y="81">list pods</text>
  <text class="code" x="30" y="121">delete configmaps</text>
  <text class="code" x="30" y="161">get secrets</text>
  <text class="code" x="30" y="201">delete pods</text>
  <text class="code" x="30" y="241">create pods/exec</text>
  <text class="code" x="30" y="281">create rolebindings</text>

  <rect class="ok" x="500" y="62" width="80" height="28" rx="6"/><text x="540" y="81" text-anchor="middle">yes</text>
  <rect class="ok" x="500" y="102" width="80" height="28" rx="6"/><text x="540" y="121" text-anchor="middle">yes</text>
  <rect class="drop" x="500" y="142" width="80" height="28" rx="6"/><text x="540" y="161" text-anchor="middle">yes</text>
  <rect class="drop" x="500" y="182" width="80" height="28" rx="6"/><text x="540" y="201" text-anchor="middle">yes</text>
  <rect class="drop" x="500" y="222" width="80" height="28" rx="6"/><text x="540" y="241" text-anchor="middle">yes</text>
  <rect class="drop" x="500" y="262" width="80" height="28" rx="6"/><text x="540" y="281" text-anchor="middle">yes</text>

  <rect class="ok" x="670" y="62" width="80" height="28" rx="6"/><text x="710" y="81" text-anchor="middle">yes</text>
  <rect class="ok" x="670" y="102" width="80" height="28" rx="6"/><text x="710" y="121" text-anchor="middle">yes</text>
  <rect class="box" x="670" y="142" width="80" height="28" rx="6"/><text x="710" y="161" text-anchor="middle">no</text>
  <rect class="box" x="670" y="182" width="80" height="28" rx="6"/><text x="710" y="201" text-anchor="middle">no</text>
  <rect class="box" x="670" y="222" width="80" height="28" rx="6"/><text x="710" y="241" text-anchor="middle">no</text>
  <rect class="box" x="670" y="262" width="80" height="28" rx="6"/><text x="710" y="281" text-anchor="middle">no</text>

  <text class="label good" x="30" y="318">green: access the crew needs</text>
  <text class="label bad" x="260" y="318">red: access the crew did not need</text>
</svg>
