<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="title desc">
  <title id="title">How an aggregated ClusterRole collects rules</title>
  <desc id="desc">The ClusterRoles outpost-reader-pods and outpost-reader-services carry the label outpost.example.com/aggregate-to-outpost-reader: "true". A controller in the control plane copies their rules into the aggregated ClusterRole outpost-reader, which has only an aggregationRule. The RoleBinding outpost-reader in outpost points at outpost-reader and gives it to the group outpost-observers.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M300 68 L368 104" marker-end="url(#arrow)"/>
  <path class="line" d="M300 158 L368 122" marker-end="url(#arrow)"/>
  <path class="okline" d="M520 113 H598" marker-end="url(#arrowok)"/>
  <path class="line" d="M710 228 V143" marker-end="url(#arrow)"/>
  <path class="line" d="M598 256 H502" marker-end="url(#arrow)"/>
  <text class="label" x="334" y="62" text-anchor="middle">label</text>
  <text class="label" x="334" y="174" text-anchor="middle">label</text>
  <text class="label good" x="559" y="103" text-anchor="middle">copies</text>
  <text class="label" x="722" y="190">roleRef</text>
  <text class="label" x="550" y="246" text-anchor="middle">subject</text>

  <rect class="box" x="20" y="40" width="280" height="56" rx="8"/>
  <text class="code" x="160" y="63" text-anchor="middle">outpost-reader-pods</text>
  <text x="160" y="84" text-anchor="middle" font-size="12">rules: get, list, watch pods</text>
  <rect class="box" x="20" y="130" width="280" height="56" rx="8"/>
  <text class="code" x="160" y="153" text-anchor="middle">outpost-reader-services</text>
  <text x="160" y="174" text-anchor="middle" font-size="12">rules: get, list, watch services</text>
  <text class="label" x="20" y="214">both carry <tspan class="code">outpost.example.com/aggregate-to-outpost-reader: "true"</tspan></text>

  <rect class="ask" x="370" y="85" width="150" height="56" rx="8"/>
  <text class="strong" x="445" y="109" text-anchor="middle">controller</text>
  <text x="445" y="129" text-anchor="middle" font-size="12">in the control plane</text>

  <rect class="ok" x="600" y="85" width="220" height="56" rx="8"/>
  <text class="code" x="710" y="108" text-anchor="middle">outpost-reader</text>
  <text x="710" y="129" text-anchor="middle" font-size="12">aggregationRule, no own rules</text>

  <rect class="box" x="600" y="230" width="220" height="56" rx="8"/>
  <text class="strong" x="710" y="254" text-anchor="middle">RoleBinding</text>
  <text x="710" y="274" text-anchor="middle" font-size="12">in <tspan class="code">outpost</tspan></text>

  <rect class="box" x="300" y="234" width="200" height="44" rx="8"/>
  <text x="400" y="261" text-anchor="middle">group <tspan class="code">outpost-observers</tspan></text>
</svg>
