<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Testing the subjects of the observers binding</title>
  <desc id="desc">The RoleBinding observers in the outpost namespace matches the user ghost, any user in the group outpost-observers, and the ServiceAccount system:serviceaccount:starfleet:probe, and gives them the view ClusterRole. The user ghosts differs by one letter, matches no subject and gets no access.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="450" y="50" width="370" height="150" rx="10"/>
  <text class="label" x="464" y="72">namespace <tspan class="code">outpost</tspan></text>
  <path class="okline" d="M350 52 L468 112" marker-end="url(#arrowok)"/>
  <path class="okline" d="M350 117 L468 130" marker-end="url(#arrowok)"/>
  <path class="okline" d="M350 182 L468 148" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M350 267 H460" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M640 130 H698" marker-end="url(#arrowok)"/>
  <text class="label" x="669" y="120" text-anchor="middle">roleRef</text>

  <rect class="box" x="20" y="30" width="330" height="44" rx="8"/>
  <text x="36" y="57">user <tspan class="code">ghost</tspan></text>
  <rect class="box" x="20" y="95" width="330" height="44" rx="8"/>
  <text x="36" y="122">user <tspan class="code">anyone</tspan>, group <tspan class="code">outpost-observers</tspan></text>
  <rect class="box" x="20" y="160" width="330" height="44" rx="8"/>
  <text class="code" x="36" y="187">system:serviceaccount:starfleet:probe</text>
  <rect class="box" x="20" y="245" width="330" height="44" rx="8"/>
  <text x="36" y="272">user <tspan class="code">ghosts</tspan></text>

  <rect class="ask" x="470" y="90" width="170" height="80" rx="8"/>
  <text class="strong" x="555" y="118" text-anchor="middle">RoleBinding</text>
  <text class="code" x="555" y="142" text-anchor="middle">observers</text>

  <rect class="ok" x="700" y="105" width="110" height="50" rx="8"/>
  <text class="code" x="755" y="128" text-anchor="middle">view</text>
  <text x="755" y="146" text-anchor="middle" font-size="12">ClusterRole</text>

  <text class="label good" x="410" y="232" text-anchor="middle">three exact matches</text>
  <text class="label bad" x="470" y="262">no match: one letter differs</text>
  <text class="label bad" x="470" y="282">result: no access</text>
</svg>
