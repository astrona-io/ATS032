<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="840" height="270" role="img" aria-labelledby="title desc">
  <title id="title">The two sides of an RBAC grant</title>
  <desc id="desc">A RoleBinding holds a list of subjects (a user, a group or a ServiceAccount) and a roleRef that points at a Role or ClusterRole with rules. A wrong or broad subject name widens access on one side; a wildcard or a role that grows widens it on the other side.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M210 60 L318 106" marker-end="url(#arrow)"/>
  <path class="line" d="M210 120 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M210 180 L318 134" marker-end="url(#arrow)"/>
  <path class="line" d="M500 120 H608" marker-end="url(#arrow)"/>
  <text class="label" x="554" y="110" text-anchor="middle">roleRef</text>

  <text class="label" x="30" y="24">Subjects (names only)</text>
  <rect class="box" x="30" y="40" width="180" height="40" rx="8"/>
  <text class="code" x="120" y="65" text-anchor="middle">User</text>
  <rect class="box" x="30" y="100" width="180" height="40" rx="8"/>
  <text class="code" x="120" y="125" text-anchor="middle">Group</text>
  <rect class="box" x="30" y="160" width="180" height="40" rx="8"/>
  <text class="code" x="120" y="185" text-anchor="middle">ServiceAccount</text>

  <rect class="ask" x="320" y="90" width="180" height="60" rx="8"/>
  <text class="strong" x="410" y="114" text-anchor="middle">RoleBinding</text>
  <text class="code" x="410" y="136" text-anchor="middle">subjects + roleRef</text>

  <text class="label" x="610" y="24">Rules</text>
  <rect class="box" x="610" y="50" width="200" height="140" rx="8"/>
  <text class="strong" x="710" y="76" text-anchor="middle">Role or ClusterRole</text>
  <text class="code" x="630" y="108">rules:</text>
  <text class="code" x="645" y="132">apiGroups</text>
  <text class="code" x="645" y="154">resources</text>
  <text class="code" x="645" y="176">verbs</text>

  <text class="label bad" x="30" y="236">Risk: a wrong name or a broad group</text>
  <text class="label bad" x="610" y="236">Risk: a wildcard or a role that grows</text>
</svg>
