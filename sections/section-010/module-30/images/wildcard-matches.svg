<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="title desc">
  <title id="title">What a star in each list matches</title>
  <desc id="desc">A rule with a star in apiGroups, resources and verbs. The star in apiGroups matches every API group, also groups that a later installation adds. The star in resources matches every resource and every subresource, such as pods/exec, pods/log and serviceaccounts/token. The star in verbs matches every verb, including escalate, bind and impersonate.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M250 140 L398 55" marker-end="url(#arrow)"/>
  <path class="line" d="M250 166 L398 155" marker-end="url(#arrow)"/>
  <path class="line" d="M250 192 L398 255" marker-end="url(#arrow)"/>

  <rect class="policy" x="30" y="90" width="220" height="130" rx="8"/>
  <text class="strong" x="46" y="114">one rule</text>
  <text class="code" x="46" y="144">apiGroups: ["*"]</text>
  <text class="code" x="46" y="170">resources: ["*"]</text>
  <text class="code" x="46" y="196">verbs: ["*"]</text>

  <rect class="drop" x="400" y="20" width="410" height="70" rx="8"/>
  <text class="strong" x="416" y="46">every API group</text>
  <text x="416" y="72">also groups that a later installation adds</text>

  <rect class="drop" x="400" y="120" width="410" height="70" rx="8"/>
  <text class="strong" x="416" y="146">every resource and subresource</text>
  <text class="code" x="416" y="172">pods/exec, pods/log, serviceaccounts/token</text>

  <rect class="drop" x="400" y="220" width="410" height="70" rx="8"/>
  <text class="strong" x="416" y="246">every verb</text>
  <text class="code" x="416" y="272">escalate, bind, impersonate</text>
</svg>
