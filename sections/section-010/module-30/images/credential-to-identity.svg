<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">How a credential becomes a user name and groups</title>
  <desc id="desc">The certificate subject /CN=jane/O=outpost-observers becomes the user name jane from the CN field and the group outpost-observers from the O field. A ServiceAccount token for probe in the starfleet namespace becomes the user name system:serviceaccount:starfleet:probe and the groups system:serviceaccounts and system:serviceaccounts:starfleet.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="160" x2="810" y2="160"/>
  <path class="line" d="M290 85 L438 52" marker-end="url(#arrow)"/>
  <path class="line" d="M290 85 L438 112" marker-end="url(#arrow)"/>
  <path class="line" d="M290 238 L438 200" marker-end="url(#arrow)"/>
  <path class="line" d="M290 238 L438 246" marker-end="url(#arrow)"/>
  <path class="line" d="M290 238 L438 290" marker-end="url(#arrow)"/>
  <text class="label" x="350" y="58" text-anchor="middle">CN</text>
  <text class="label" x="350" y="120" text-anchor="middle">O</text>

  <rect class="box" x="30" y="50" width="260" height="70" rx="8"/>
  <text class="strong" x="160" y="76" text-anchor="middle">client certificate subject</text>
  <text class="code" x="160" y="100" text-anchor="middle">/CN=jane/O=outpost-observers</text>

  <rect class="ok" x="440" y="32" width="380" height="40" rx="8"/>
  <text x="460" y="57">user name: <tspan class="code">jane</tspan></text>
  <rect class="ok" x="440" y="92" width="380" height="40" rx="8"/>
  <text x="460" y="117">group: <tspan class="code">outpost-observers</tspan></text>

  <rect class="box" x="30" y="203" width="260" height="70" rx="8"/>
  <text class="strong" x="160" y="229" text-anchor="middle">ServiceAccount token</text>
  <text class="code" x="160" y="253" text-anchor="middle">probe in starfleet</text>

  <rect class="ok" x="440" y="182" width="380" height="36" rx="8"/>
  <text x="456" y="205">user: <tspan class="code">system:serviceaccount:starfleet:probe</tspan></text>
  <rect class="ok" x="440" y="228" width="380" height="36" rx="8"/>
  <text x="456" y="251">group: <tspan class="code">system:serviceaccounts</tspan></text>
  <rect class="ok" x="440" y="274" width="380" height="36" rx="8"/>
  <text x="456" y="297">group: <tspan class="code">system:serviceaccounts:starfleet</tspan></text>
</svg>
