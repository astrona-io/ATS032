<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Steps to replace a wildcard</title>
  <desc id="desc">For each wildcard: find it by searching the role YAML for the quoted star, find the real need, write explicit lists with resource names from kubectl api-resources, then apply the Role in place and test both allowed and denied actions.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 75 H218" marker-end="url(#arrow)"/>
  <path class="line" d="M390 75 H418" marker-end="url(#arrow)"/>
  <path class="line" d="M590 75 H618" marker-end="url(#arrow)"/>

  <rect class="ask" x="20" y="40" width="170" height="70" rx="8"/>
  <text class="strong" x="105" y="68" text-anchor="middle">Find the wildcard</text>
  <text x="105" y="92" text-anchor="middle" font-size="13">search for <tspan class="code">'*'</tspan></text>

  <rect class="box" x="220" y="40" width="170" height="70" rx="8"/>
  <text class="strong" x="305" y="68" text-anchor="middle">Find the need</text>
  <text x="305" y="92" text-anchor="middle" font-size="13">what the identity does</text>

  <rect class="box" x="420" y="40" width="170" height="70" rx="8"/>
  <text class="strong" x="505" y="68" text-anchor="middle">Write explicit lists</text>
  <text class="code" x="505" y="92" text-anchor="middle">api-resources</text>

  <rect class="ok" x="620" y="40" width="180" height="70" rx="8"/>
  <text class="strong" x="710" y="68" text-anchor="middle">Apply in place</text>
  <text x="710" y="92" text-anchor="middle" font-size="13">test allowed and denied</text>
</svg>
