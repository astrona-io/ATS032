questions:
- id: ats032-final-010-q01
  type: single_choice
  difficulty: advanced
  learning_objective: Order the steps of a safe rewrite.
  source_readings:
  - sections/section-010/module-02/course-03-rewrite-a-broad-grant-as-least-privilege.md
  prompt: A workload holds a broad ClusterRoleBinding. Which order replaces it with
    a narrow grant without an outage?
  options:
  - id: a
    text: Delete the broad binding, then create the narrow grant
    explanation: The workload has no access in between.
  - id: b
    text: Create and test the narrow grant, delete the broad binding, then test the
      denied actions
    explanation: Correct. The workload is never without access, and the final test
      shows what stays allowed.
  - id: c
    text: Create the narrow grant and keep the broad binding, because RBAC picks the
      smaller grant
    explanation: RBAC grants add up. The broad binding keeps all of its access.
  correct_option: b
  explanation: Add the narrow grant, test it, remove the broad one, and test the denied
    actions last.
- id: ats032-final-010-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how an aggregated ClusterRole gets its rules.
  source_readings:
  - sections/section-010/module-03/course-02-built-in-and-aggregated-clusterroles.md
  prompt: An aggregated ClusterRole has an `aggregationRule` with a label selector.
    Where do its rules come from?
  options:
  - id: a
    text: From the `rules` field that the author writes in it
    explanation: The controller overwrites any rules written by hand.
  - id: b
    text: From the rules of every ClusterRole that carries the matching label, copied
      by a controller
    explanation: Correct. The aggregated role holds a copy of those rules.
  - id: c
    text: From the RoleBindings that name it
    explanation: Bindings do not carry rules.
  correct_option: b
  explanation: A controller copies the rules of every ClusterRole with a matching
    label into the aggregated role.
- id: ats032-final-010-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Explain what a wildcard in verbs matches.
  source_readings:
  - sections/section-010/module-03/course-03-remove-wildcards-and-narrow-rules.md
  prompt: 'A Role has `verbs: ["*"]` for `resources: ["pods"]`. Which action does
    it allow?'
  options:
  - id: a
    text: Only the verbs `get`, `list` and `watch`
    explanation: The wildcard matches every verb.
  - id: b
    text: Every verb on Pods, including `delete` and `deletecollection`
    explanation: Correct. The wildcard matches every verb, including the ones that
      are added later.
  - id: c
    text: Every verb on every resource of the namespace
    explanation: The resource list still limits the rule to Pods.
  correct_option: b
  explanation: A wildcard in `verbs` matches every verb on the listed resources.
- id: ats032-final-020-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose a binding that keeps a workload least privileged.
  source_readings:
  - sections/section-020/module-02/course-02-grant-only-what-the-workload-uses.md
  prompt: A workload in one namespace must read pods there. Which setup is least privileged?
  options:
  - id: a
    text: A dedicated ServiceAccount, a Role with `get` and `list` on `pods`, and
      a RoleBinding
    explanation: Correct.
  - id: b
    text: The `default` ServiceAccount with a ClusterRoleBinding to `view`
    explanation: "`default` is shared and the binding applies in every namespace."
  - id: c
    text: A dedicated ServiceAccount bound to `cluster-admin`
    explanation: This grants far more than needed.
  correct_option: a
  explanation: Use one account, a narrow Role and a RoleBinding.
- id: ats032-final-020-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Recognise that a group binding reaches accounts with mounting
    off.
  source_readings:
  - sections/section-020/module-03/course-02-audit-grants-that-reach-serviceaccounts.md
  prompt: A RoleBinding gives `view` to the group `system:serviceaccounts:outpost`.
    The account `archive` in `outpost` has token mounting turned off. Can `archive`
    list pods in `outpost`?
  options:
  - id: a
    text: No, because it has no token mounted
    explanation: Permissions come from bindings, not from the mount.
  - id: b
    text: Yes, because the group contains every ServiceAccount of the namespace
    explanation: Correct.
  - id: c
    text: No, because group bindings do not apply to ServiceAccounts
    explanation: They do apply.
  correct_option: b
  explanation: The mount setting limits theft from a container, not the permissions
    of the account.
- id: ats032-final-020-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Test a token with another audience.
  source_readings:
  - sections/section-020/module-03/course-03-audit-tokens-secrets-lifetimes-and-audience.md
  prompt: A token is created with `kubectl create token archive --audience=ledger`.
    What does the API server do when it receives this token?
  options:
  - id: a
    text: It accepts the token with the permissions of `archive`
    explanation: The audience does not match.
  - id: b
    text: It refuses the token as `Unauthorized`, because it accepts only its own
      audience
    explanation: Correct.
  - id: c
    text: It accepts the token for read requests only
    explanation: There is no such rule.
  correct_option: b
  explanation: The audience names the party that accepts the token.
- id: ats032-final-030-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Judge the effect of a binding to the unauthenticated group.
  source_readings:
  - sections/section-030/module-02/course-02-anonymous-access-in-practice.md
  prompt: A ClusterRoleBinding gives the `view` ClusterRole to the group `system:unauthenticated`.
    Which statement is true?
  options:
  - id: a
    text: Any caller that can reach the API port can read the objects that `view`
      covers
    explanation: Correct. Anonymous requests are authorized like any request, and
      the binding names their group.
  - id: b
    text: Only requests from inside the cluster can use the grant
    explanation: The grant does not depend on the source address.
  - id: c
    text: The grant has no effect because anonymous requests skip authorization
    explanation: Anonymous requests go through authorization.
  correct_option: a
  explanation: The fix is to delete the binding that names the anonymous subject.
- id: ats032-final-030-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the result of an invalid bearer token.
  source_readings:
  - sections/section-030/module-02/course-01-authentication-methods-and-identities.md
  prompt: "`--anonymous-auth` is `true`. A request sends a bearer token that no authentication
    method accepts. What does the API server return?"
  options:
  - id: a
    text: "`401 Unauthorized`"
    explanation: Correct. A credential that fails verification is rejected.
  - id: b
    text: "`200` as `system:anonymous`"
    explanation: Anonymous treatment applies only to requests with no credential.
  - id: c
    text: "`403 Forbidden`"
    explanation: A `403` needs a known identity that authorization refused.
  correct_option: a
  explanation: Only a request with no credential can become anonymous.
- id: ats032-final-030-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose a failure policy for a security webhook.
  source_readings:
  - sections/section-030/module-03/course-03-admission-webhooks-and-failure-policy.md
  prompt: A validating webhook enforces a security rule that must always apply. Which
    `failurePolicy` fits, and what is the cost?
  options:
  - id: a
    text: "`Ignore`, and the cost is that the rule is skipped when the service is
      down"
    explanation: That makes the rule a bypass whenever the call fails.
  - id: b
    text: "`Fail`, and the cost is that matching requests are rejected when the service
      is down"
    explanation: Correct. Exclude the namespace of the webhook and `kube-system` to
      avoid a deadlock.
  - id: c
    text: Either one, because the policy only affects the log
    explanation: The policy decides whether a failed call rejects or admits the request.
  correct_option: b
  explanation: Use `Fail` for a rule that must always apply and keep the webhook out
    of the namespaces that it needs to run.
- id: ats032-final-040-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name a source that publishes Kubernetes vulnerabilities.
  source_readings:
  - sections/section-040/module-02/course-01-where-vulnerabilities-are-published.md
  prompt: Which source lets a script watch for new Kubernetes CVEs?
  options:
  - id: a
    text: The official CVE feed, published as JSON and RSS
    explanation: Correct.
  - id: b
    text: The release notes of the next minor version
    explanation: Release notes are written for people and are not a machine-readable
      feed.
  - id: c
    text: The kubelet log of each node
    explanation: The log records node events, not published vulnerabilities.
  correct_option: a
  explanation: The official feed is structured, so a script can compare new entries
    with the versions that the cluster runs.
- id: ats032-final-040-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a node can still refuse Pods after uncordon.
  source_readings:
  - sections/section-040/module-03/course-02-verify-the-cluster-after-an-upgrade.md
  prompt: After kubectl uncordon, a node still refuses new Pods and shows the taint
    maintenance=patching:NoSchedule. What is the fix?
  options:
  - id: a
    text: Remove the taint with kubectl taint nodes NODE maintenance=patching:NoSchedule-
    explanation: Correct.
  - id: b
    text: Drain the node again
    explanation: A drain does not remove a taint.
  - id: c
    text: Wait for the taint to expire
    explanation: A taint stays until someone removes it.
  correct_option: a
  explanation: A custom taint is separate from the unschedulable flag, and uncordon
    does not change it.
- id: ats032-final-040-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Choose between fixing forward and restoring etcd.
  source_readings:
  - sections/section-040/module-03/course-03-rollback-limits-and-restore-drills.md
  prompt: After an upgrade the control plane is healthy and one application fails.
    What is the best response?
  options:
  - id: a
    text: Downgrade the API server to the previous minor version
    explanation: Kubernetes does not support a downgrade.
  - id: b
    text: Restore etcd from the pre-upgrade snapshot
    explanation: A restore removes every change made since the snapshot.
  - id: c
    text: Fix forward on the new version
    explanation: Correct.
  correct_option: c
  explanation: Restoring is for a damaged control plane or damaged data, not for one
    failing application.
