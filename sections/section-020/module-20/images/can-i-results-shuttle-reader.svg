<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Permission checks for shuttle-reader</title>
  <desc id="desc">kubectl auth can-i answers yes for get pods in starfleet and for get configmap/probe-code. It answers no for delete pods, get secrets, get configmap/other and get pods in outpost.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M250 190 L338 60" marker-end="url(#arrowok)"/>
  <path class="okline" d="M250 190 L338 112" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M250 190 L338 184" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M250 190 L338 236" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M250 190 L338 288" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M250 190 L338 340" marker-end="url(#arrowbad)"/>
  <line class="sep" x1="340" y1="138" x2="810" y2="138"/>
  <rect class="ask" x="30" y="160" width="220" height="60" rx="8"/>
  <text x="140.0" y="185.0" text-anchor="middle">ServiceAccount</text>
  <text class="code" x="140.0" y="205.0" text-anchor="middle">shuttle-reader</text>
  <rect class="ok" x="340" y="40" width="290" height="40" rx="8"/>
  <text class="code" x="485.0" y="65.0" text-anchor="middle">get pods -n starfleet</text>
  <text class="strong good" x="650" y="65">yes</text>
  <rect class="ok" x="340" y="92" width="290" height="40" rx="8"/>
  <text class="code" x="485.0" y="117.0" text-anchor="middle">get configmap/probe-code</text>
  <text class="strong good" x="650" y="117">yes</text>
  <rect class="drop" x="340" y="164" width="290" height="40" rx="8"/>
  <text class="code" x="485.0" y="189.0" text-anchor="middle">delete pods -n starfleet</text>
  <text class="strong bad" x="650" y="189">no</text>
  <rect class="drop" x="340" y="216" width="290" height="40" rx="8"/>
  <text class="code" x="485.0" y="241.0" text-anchor="middle">get secrets -n starfleet</text>
  <text class="strong bad" x="650" y="241">no</text>
  <rect class="drop" x="340" y="268" width="290" height="40" rx="8"/>
  <text class="code" x="485.0" y="293.0" text-anchor="middle">get configmap/other</text>
  <text class="strong bad" x="650" y="293">no</text>
  <rect class="drop" x="340" y="320" width="290" height="40" rx="8"/>
  <text class="code" x="485.0" y="345.0" text-anchor="middle">get pods -n outpost</text>
  <text class="strong bad" x="650" y="345">no</text>
  <text class="label" x="700" y="64">named in the Role</text>
  <text class="label" x="700" y="250">not in the Role</text>
</svg>
