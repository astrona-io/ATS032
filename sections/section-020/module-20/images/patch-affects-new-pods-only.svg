<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">What the automount patch changes</title>
  <desc id="desc">Top: after the patch on the default ServiceAccount, the shuttle pod that was created before keeps its token, and a new pod created after the patch gets no token. Bottom: if you delete the default account, the ServiceAccount controller creates it again.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="200" x2="810" y2="200"/>
  <path class="line" d="M340 90 L418 62" marker-end="url(#arrow)"/>
  <path class="line" d="M340 120 L418 148" marker-end="url(#arrow)"/>
  <path class="line" d="M260 275 H318" marker-end="url(#arrow)"/>
  <path class="okline" d="M540 275 H598" marker-end="url(#arrowok)"/>
  <rect class="policy" x="20" y="70" width="320" height="70" rx="8"/>
  <text x="180.0" y="100.0" text-anchor="middle">patch ServiceAccount <tspan class="code">default</tspan></text>
  <text class="code" x="180.0" y="120.0" text-anchor="middle">automountServiceAccountToken: false</text>
  <rect class="ask" x="420" y="30" width="190" height="60" rx="8"/>
  <text x="515.0" y="55.0" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <text x="515.0" y="75.0" text-anchor="middle">created before</text>
  <rect class="ok" x="420" y="120" width="190" height="60" rx="8"/>
  <text x="515.0" y="145.0" text-anchor="middle">new pod</text>
  <text x="515.0" y="165.0" text-anchor="middle">created after</text>
  <text x="630" y="65">keeps its token</text>
  <text x="630" y="155">gets no token</text>
  <rect class="drop" x="30" y="245" width="230" height="60" rx="8"/>
  <text x="145.0" y="270.0" text-anchor="middle">delete ServiceAccount</text>
  <text class="code" x="145.0" y="290.0" text-anchor="middle">default</text>
  <rect class="box" x="320" y="245" width="220" height="60" rx="8"/>
  <text x="430.0" y="270.0" text-anchor="middle">ServiceAccount</text>
  <text x="430.0" y="290.0" text-anchor="middle">controller</text>
  <rect class="ok" x="600" y="245" width="210" height="60" rx="8"/>
  <text x="705.0" y="270.0" text-anchor="middle">creates <tspan class="code">default</tspan></text>
  <text x="705.0" y="290.0" text-anchor="middle">again</text>
</svg>
