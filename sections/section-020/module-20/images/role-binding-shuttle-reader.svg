<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">RoleBinding shuttle-reader</title>
  <desc id="desc">In the starfleet namespace, the RoleBinding shuttle-reader names the ServiceAccount shuttle-reader in subjects and the Role shuttle-reader in roleRef. The Role allows get and list on pods, and get on the ConfigMap probe-code only.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="20" width="800" height="250" rx="10"/>
  <text class="label" x="36" y="44">namespace <tspan class="code">starfleet</tspan></text>
  <path class="line" d="M320 145 H252" marker-end="url(#arrow)"/>
  <path class="line" d="M500 145 H568" marker-end="url(#arrow)"/>
  <text class="label" x="286" y="133" text-anchor="middle">subjects</text>
  <text class="label" x="534" y="133" text-anchor="middle">roleRef</text>
  <rect class="ask" x="40" y="115" width="210" height="60" rx="8"/>
  <text x="145.0" y="140.0" text-anchor="middle">ServiceAccount</text>
  <text class="code" x="145.0" y="160.0" text-anchor="middle">shuttle-reader</text>
  <rect class="policy" x="320" y="115" width="180" height="60" rx="8"/>
  <text x="410.0" y="140.0" text-anchor="middle">RoleBinding</text>
  <text class="code" x="410.0" y="160.0" text-anchor="middle">shuttle-reader</text>
  <rect class="box" x="570" y="60" width="230" height="180" rx="8"/>
  <text x="685" y="88" text-anchor="middle">Role <tspan class="code">shuttle-reader</tspan></text>
  <line class="sep" x1="586" y1="102" x2="784" y2="102"/>
  <text class="code" x="586" y="128">pods:</text>
  <text class="code" x="600" y="148">get, list</text>
  <text class="code" x="586" y="180">configmaps:</text>
  <text class="code" x="600" y="200">get</text>
  <text class="code" x="600" y="220">only probe-code</text>
</svg>
