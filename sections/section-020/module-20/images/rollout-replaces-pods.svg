<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">A rollout replaces pods to change the account</title>
  <desc id="desc">The pod template of the probe Deployment now names the probe ServiceAccount. The Deployment controller deletes the old pod, which still has serviceAccountName default, and creates a new pod with serviceAccountName probe.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="dashed" d="M330 118 L200 188" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M510 118 L640 188" marker-end="url(#arrowok)"/>
  <text class="label bad" x="232" y="140">deletes</text>
  <text class="label good" x="560" y="140">creates</text>
  <rect class="box" x="280" y="40" width="280" height="76" rx="8"/>
  <text x="420.0" y="73.0" text-anchor="middle">Deployment controller</text>
  <text x="420.0" y="93.0" text-anchor="middle">template: <tspan class="code">serviceAccountName: probe</tspan></text>
  <rect class="drop" x="40" y="190" width="280" height="70" rx="8"/>
  <text x="180.0" y="220.0" text-anchor="middle">old <tspan class="code">probe</tspan> pod</text>
  <text class="code" x="180.0" y="240.0" text-anchor="middle">serviceAccountName: default</text>
  <rect class="ok" x="520" y="190" width="280" height="70" rx="8"/>
  <text x="660.0" y="220.0" text-anchor="middle">new <tspan class="code">probe</tspan> pod</text>
  <text class="code" x="660.0" y="240.0" text-anchor="middle">serviceAccountName: probe</text>
  <text x="420" y="300" text-anchor="middle">A pod never changes its account. The rollout replaces the pod.</text>
</svg>
