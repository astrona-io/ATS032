apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-020-02-03
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-032-020-02-03
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-access
  namespace: starfleet-032-020-02-03
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-pod-access
  namespace: starfleet-032-020-02-03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-access
subjects:
- kind: ServiceAccount
  name: default
  namespace: starfleet-032-020-02-03
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drifter-view
  namespace: outpost-032-020-02-03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: default
  namespace: outpost-032-020-02-03
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-032-020-02-03
  labels:
    app: shuttle
spec:
  restartPolicy: Never
  containers:
  - name: shuttle
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-032-020-02-03
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
  - name: drifter
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "sleep 86400"]
