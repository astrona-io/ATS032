apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-020-03-01
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: ledger-config-reader
    description: The ServiceAccount ledger can only get and list ConfigMaps in its namespace and has no access elsewhere
    type: file
    source: validation/validate-ledger-config-reader.sh
    points: 2
  - name: archive-no-access
    description: The ServiceAccount archive has no permissions of its own
    type: file
    source: validation/validate-archive-no-access.sh
    points: 1
  - name: group-bindings-removed
    description: No binding gives permissions to the group of all ServiceAccounts in the namespace
    type: file
    source: validation/validate-group-bindings-removed.sh
    points: 1
