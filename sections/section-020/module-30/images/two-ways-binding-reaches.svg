<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Two ways a binding reaches a ServiceAccount</title>
  <desc id="desc">The ClusterRoleBinding ledger-edit names the ServiceAccount ledger directly and gives it the edit ClusterRole in all namespaces. The RoleBinding outpost-all-view names the group system:serviceaccounts:outpost, which holds every account in outpost, so ledger, archive and default all get the view ClusterRole in outpost.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="620" y="24" width="220" height="330" rx="10"/>
  <text class="label" x="636" y="48">namespace outpost</text>

  <path class="line" d="M290 80 H648" marker-end="url(#arrow)"/>
  <path class="line" d="M290 290 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M580 280 L648 94" marker-end="url(#arrow)"/>
  <path class="line" d="M580 288 L648 196" marker-end="url(#arrow)"/>
  <path class="line" d="M580 298 L648 300" marker-end="url(#arrow)"/>
  <text class="label" x="470" y="70" text-anchor="middle">names the account</text>
  <text class="label" x="450" y="244" text-anchor="middle">holds every account in outpost</text>

  <rect class="ask" x="30" y="50" width="260" height="60" rx="8"/>
  <text x="160" y="74" text-anchor="middle">ClusterRoleBinding <tspan class="code">ledger-edit</tspan></text>
  <text x="160" y="96" text-anchor="middle"><tspan class="code">edit</tspan> in all namespaces</text>

  <rect class="ask" x="30" y="260" width="260" height="60" rx="8"/>
  <text x="160" y="284" text-anchor="middle">RoleBinding <tspan class="code">outpost-all-view</tspan></text>
  <text x="160" y="306" text-anchor="middle"><tspan class="code">view</tspan> in <tspan class="code">outpost</tspan> only</text>

  <rect class="box" x="320" y="260" width="260" height="60" rx="8"/>
  <text x="450" y="284" text-anchor="middle">Group</text>
  <text x="450" y="306" text-anchor="middle" class="code">system:serviceaccounts:outpost</text>

  <rect class="box" x="650" y="64" width="170" height="44" rx="8"/>
  <text x="735" y="91" text-anchor="middle" class="code">ledger</text>
  <rect class="box" x="650" y="174" width="170" height="44" rx="8"/>
  <text x="735" y="201" text-anchor="middle" class="code">archive</text>
  <rect class="box" x="650" y="278" width="170" height="44" rx="8"/>
  <text x="735" y="305" text-anchor="middle" class="code">default</text>
</svg>
