<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc">
  <title id="title">When a pod holds a ServiceAccount token</title>
  <desc id="desc">If the pod sets automountServiceAccountToken, the pod value decides. If the pod leaves it out and the ServiceAccount sets it, the account value decides. If neither sets it, the token is mounted. A projected serviceAccountToken volume mounts a token on its own path, whatever the two fields say.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 72 V108" marker-end="url(#arrow)"/>
  <path class="line" d="M340 134 H438" marker-end="url(#arrow)"/>
  <path class="line" d="M190 160 V218" marker-end="url(#arrow)"/>
  <path class="line" d="M340 244 H438" marker-end="url(#arrow)"/>
  <path class="line" d="M190 270 V328" marker-end="url(#arrow)"/>

  <text class="label" x="390" y="126" text-anchor="middle">yes</text>
  <text class="label" x="202" y="194">no</text>
  <text class="label" x="390" y="236" text-anchor="middle">yes</text>
  <text class="label" x="202" y="304">no</text>

  <rect class="box" x="40" y="24" width="300" height="48" rx="8"/>
  <text x="190" y="53" text-anchor="middle" class="code">automountServiceAccountToken</text>

  <rect class="ask" x="40" y="110" width="300" height="50" rx="8"/>
  <text x="190" y="140" text-anchor="middle">Does the pod set the field?</text>

  <rect class="box" x="440" y="110" width="360" height="50" rx="8"/>
  <text x="620" y="140" text-anchor="middle">The pod value decides: true or false</text>

  <rect class="ask" x="40" y="220" width="300" height="50" rx="8"/>
  <text x="190" y="250" text-anchor="middle">Does the ServiceAccount set it?</text>

  <rect class="box" x="440" y="220" width="360" height="50" rx="8"/>
  <text x="620" y="250" text-anchor="middle">The account value decides: true or false</text>

  <rect class="ok" x="40" y="330" width="300" height="50" rx="8"/>
  <text x="190" y="360" text-anchor="middle" class="strong">The token is mounted</text>

  <text class="label" x="440" y="322">separate path</text>
  <rect class="policy" x="440" y="330" width="360" height="50" rx="8"/>
  <text x="620" y="352" text-anchor="middle">A projected <tspan class="code">serviceAccountToken</tspan> volume</text>
  <text x="620" y="371" text-anchor="middle">mounts a token whatever the fields say</text>
</svg>
