<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">How long each kind of token lives</title>
  <desc id="desc">On a scale of 24 hours: the legacy token Secret ledger-legacy-token never expires. The projected token of ledger-client lives 86400 seconds, which is 24 hours. The default mounted token lives 3607 seconds, a little over one hour. The shortest token the API accepts lives 600 seconds, which is 10 minutes.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="320" y1="270" x2="800" y2="270"/>
  <line class="sep" x1="320" y1="40" x2="320" y2="276"/>
  <line class="sep" x1="560" y1="264" x2="560" y2="276"/>
  <line class="sep" x1="800" y1="264" x2="800" y2="276"/>
  <text class="label" x="320" y="296" text-anchor="middle">0</text>
  <text class="label" x="560" y="296" text-anchor="middle">12 hours</text>
  <text class="label" x="800" y="296" text-anchor="middle">24 hours</text>

  <text x="30" y="62" class="strong">Legacy token Secret</text>
  <text x="30" y="82" class="code">ledger-legacy-token</text>
  <path class="dashed" d="M800 70 H826" marker-end="url(#arrowbad)"/>
  <rect class="drop" x="320" y="50" width="480" height="40" rx="6"/>
  <text x="560" y="75" text-anchor="middle">never expires</text>

  <text x="30" y="122" class="strong">Projected token</text>
  <text x="30" y="142" class="code">ledger-client</text>
  <rect class="ask" x="320" y="110" width="480" height="40" rx="6"/>
  <text x="560" y="135" text-anchor="middle">86400 seconds = 24 hours</text>

  <text x="30" y="182" class="strong">Default mounted token</text>
  <text x="30" y="202">set by Kubernetes</text>
  <rect class="box" x="320" y="170" width="20.0" height="40" rx="3"/>
  <text x="352.0" y="195">3607 seconds, a little over 1 hour</text>

  <text x="30" y="242" class="strong">Shortest allowed token</text>
  <text x="30" y="262" class="code">--duration=10m</text>
  <rect class="ok" x="320" y="226" width="4" height="32" rx="2"/>
  <text x="336" y="247">600 seconds = 10 minutes, the minimum</text>
</svg>
