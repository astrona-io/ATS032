<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="title desc">
  <title id="title">The API server checks the token audience</title>
  <desc id="desc">A token for the archive account with the default audience reaches kube-apiserver and is accepted: whoami prints system:serviceaccount:outpost:archive. A token for the same account with the audience ledger reaches kube-apiserver and is refused with Unauthorized.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M350 80 H398" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M350 200 H398" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M580 80 H618" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M580 200 H618" marker-end="url(#arrowbad)"/>

  <rect class="box" x="10" y="50" width="340" height="60" rx="8"/>
  <text x="180" y="74" text-anchor="middle" class="code">create token archive</text>
  <text x="180" y="96" text-anchor="middle">audience: the API server (default)</text>

  <rect class="box" x="10" y="170" width="340" height="60" rx="8"/>
  <text x="180" y="194" text-anchor="middle" class="code">create token archive --audience=ledger</text>
  <text x="180" y="216" text-anchor="middle">audience: <tspan class="code">ledger</tspan></text>

  <rect class="ask" x="400" y="40" width="180" height="200" rx="8"/>
  <text x="490" y="132" text-anchor="middle" class="code">kube-apiserver</text>
  <text x="490" y="154" text-anchor="middle">checks the audience</text>

  <rect class="ok" x="620" y="50" width="200" height="60" rx="8"/>
  <text x="720" y="74" text-anchor="middle" class="strong">Accepted</text>
  <text x="720" y="96" text-anchor="middle">user is <tspan class="code">archive</tspan></text>

  <rect class="drop" x="620" y="170" width="200" height="60" rx="8"/>
  <text x="720" y="194" text-anchor="middle" class="strong">Refused</text>
  <text x="720" y="216" text-anchor="middle" class="code">Unauthorized</text>
</svg>
