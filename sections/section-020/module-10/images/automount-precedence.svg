<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Which automountServiceAccountToken setting wins</title>
  <desc id="desc">When the API server creates a pod, it first checks whether the pod spec sets automountServiceAccountToken. If yes, the pod value decides. If not, it checks the ServiceAccount; if the ServiceAccount sets the field, that value decides. If neither sets it, the token is mounted. The setting is read once, when the pod is created.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M200 76 V118" marker-end="url(#arrow)"/>
  <path class="line" d="M360 145 H478" marker-end="url(#arrow)"/>
  <path class="line" d="M200 172 V238" marker-end="url(#arrow)"/>
  <path class="line" d="M360 265 H478" marker-end="url(#arrow)"/>
  <path class="line" d="M200 292 V358" marker-end="url(#arrow)"/>
  <text class="label" x="420" y="137" text-anchor="middle">yes</text>
  <text class="label" x="212" y="210">no</text>
  <text class="label" x="420" y="257" text-anchor="middle">yes</text>
  <text class="label" x="212" y="330">no</text>
  <rect class="box" x="40" y="24" width="320" height="52" rx="8"/>
  <text class="strong" x="200.0" y="55" text-anchor="middle">The API server creates the pod</text>
  <rect class="ask" x="40" y="118" width="320" height="54" rx="8"/>
  <text x="200.0" y="140" text-anchor="middle">Does the pod spec set</text>
  <text x="200.0" y="160" text-anchor="middle"><tspan class="code">automountServiceAccountToken</tspan></text>
  <rect class="box" x="480" y="118" width="320" height="54" rx="8"/>
  <text x="640.0" y="140" text-anchor="middle">The pod value decides</text>
  <text x="640.0" y="160" text-anchor="middle"><tspan class="code">true</tspan> mounts, <tspan class="code">false</tspan> does not</text>
  <rect class="ask" x="40" y="238" width="320" height="54" rx="8"/>
  <text x="200.0" y="260" text-anchor="middle">Does the ServiceAccount set</text>
  <text x="200.0" y="280" text-anchor="middle"><tspan class="code">automountServiceAccountToken</tspan></text>
  <rect class="box" x="480" y="238" width="320" height="54" rx="8"/>
  <text x="640.0" y="260" text-anchor="middle">The ServiceAccount value decides</text>
  <text x="640.0" y="280" text-anchor="middle"><tspan class="code">true</tspan> mounts, <tspan class="code">false</tspan> does not</text>
  <rect class="ok" x="40" y="360" width="320" height="52" rx="8"/>
  <text class="strong" x="200.0" y="391" text-anchor="middle">Token is mounted (default)</text>
  <text class="label" x="480" y="386">Read once, when the pod is created.</text>
</svg>
