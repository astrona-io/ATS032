<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" role="img" aria-labelledby="title desc">
  <title id="title">Each receiver accepts only its own audience</title>
  <desc id="desc">A token with the default audience is accepted by kube-apiserver. A projected token with audience ledger is rejected by kube-apiserver because the audience does not match, and accepted by the ledger service.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="okline" d="M260 80 H558" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M260 220 H558" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M260 240 V320 H558" marker-end="url(#arrowok)"/>
  <text class="label good" x="410" y="70" text-anchor="middle">accepted: audience matches</text>
  <text class="label bad" x="410" y="210" text-anchor="middle">rejected: wrong audience</text>
  <text class="label good" x="410" y="310" text-anchor="middle">accepted: audience matches</text>
  <rect class="box" x="20" y="52" width="240" height="56" rx="8"/>
  <text x="140.0" y="75" text-anchor="middle">default token</text>
  <text x="140.0" y="95" text-anchor="middle">audience: the API server</text>
  <rect class="box" x="20" y="192" width="240" height="56" rx="8"/>
  <text x="140.0" y="215" text-anchor="middle">projected token</text>
  <text x="140.0" y="235" text-anchor="middle"><tspan class="code">audience: ledger</tspan></text>
  <rect class="ok" x="560" y="52" width="240" height="56" rx="8"/>
  <text x="680.0" y="85" text-anchor="middle"><tspan class="code">kube-apiserver</tspan></text>
  <rect class="drop" x="560" y="192" width="240" height="56" rx="8"/>
  <text x="680.0" y="225" text-anchor="middle"><tspan class="code">kube-apiserver</tspan></text>
  <rect class="ok" x="560" y="292" width="240" height="56" rx="8"/>
  <text x="680.0" y="325" text-anchor="middle">service <tspan class="code">ledger</tspan></text>
</svg>
