<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370" role="img" aria-labelledby="title desc">
  <title id="title">The three sources of the default projected volume</title>
  <desc id="desc">The kubelet fills a projected volume whose name starts with kube-api-access-. A token from the API server through the TokenRequest API becomes the file token. The CA bundle from the ConfigMap kube-root-ca.crt becomes ca.crt. The namespace of the pod becomes the file namespace. The kubelet mounts the volume at /var/run/secrets/kubernetes.io/serviceaccount.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M230 70 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M230 160 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M230 250 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M520 70 H598" marker-end="url(#arrow)"/>
  <path class="line" d="M520 160 H598" marker-end="url(#arrow)"/>
  <path class="line" d="M520 250 H598" marker-end="url(#arrow)"/>
  <text class="label" x="274" y="58" text-anchor="middle">TokenRequest</text>
  <rect class="box" x="30" y="44" width="200" height="52" rx="8"/>
  <text x="130.0" y="65" text-anchor="middle">API server</text>
  <text x="130.0" y="85" text-anchor="middle"><tspan class="code">kube-apiserver</tspan></text>
  <rect class="box" x="30" y="134" width="200" height="52" rx="8"/>
  <text x="130.0" y="155" text-anchor="middle">ConfigMap</text>
  <text x="130.0" y="175" text-anchor="middle"><tspan class="code">kube-root-ca.crt</tspan></text>
  <rect class="box" x="30" y="224" width="200" height="52" rx="8"/>
  <text x="130.0" y="245" text-anchor="middle">the pod</text>
  <text x="130.0" y="265" text-anchor="middle">its namespace</text>
  <rect class="policy" x="320" y="30" width="200" height="260" rx="10"/>
  <text class="strong" x="420" y="22" text-anchor="middle">projected volume</text>
  <rect class="ask" x="336" y="48" width="168" height="44" rx="8"/>
  <text x="420.0" y="75" text-anchor="middle">token source</text>
  <rect class="ask" x="336" y="138" width="168" height="44" rx="8"/>
  <text x="420.0" y="165" text-anchor="middle">CA bundle source</text>
  <rect class="ask" x="336" y="228" width="168" height="44" rx="8"/>
  <text x="420.0" y="255" text-anchor="middle">namespace source</text>
  <rect class="frame" x="580" y="30" width="230" height="260" rx="10"/>
  <text class="label" x="695" y="22" text-anchor="middle">container of the pod</text>
  <rect class="ok" x="600" y="48" width="190" height="44" rx="8"/>
  <text x="695.0" y="75" text-anchor="middle"><tspan class="code">token</tspan></text>
  <rect class="ok" x="600" y="138" width="190" height="44" rx="8"/>
  <text x="695.0" y="165" text-anchor="middle"><tspan class="code">ca.crt</tspan></text>
  <rect class="ok" x="600" y="228" width="190" height="44" rx="8"/>
  <text x="695.0" y="255" text-anchor="middle"><tspan class="code">namespace</tspan></text>
  <text class="label" x="420" y="316" text-anchor="middle">volume name starts with <tspan class="code">kube-api-access-</tspan></text>
  <text class="label" x="695" y="316" text-anchor="middle">mount path</text>
  <text class="code" x="695" y="336" text-anchor="middle">/var/run/secrets/</text>
  <text class="code" x="695" y="354" text-anchor="middle">kubernetes.io/serviceaccount</text>
</svg>
