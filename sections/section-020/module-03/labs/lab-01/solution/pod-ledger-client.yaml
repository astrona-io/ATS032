apiVersion: v1
kind: Pod
metadata:
  name: ledger-client
  namespace: outpost
  labels:
    app: ledger-client
spec:
  serviceAccountName: ledger
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: ledger-token
      mountPath: /var/run/tokens
      readOnly: true
  volumes:
  - name: ledger-token
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
