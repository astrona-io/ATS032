apiVersion: v1
kind: Namespace
metadata:
  name: outpost-032-020-03-02
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: outpost-032-020-03-02
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: archive
  namespace: outpost-032-020-03-02
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ledger-legacy-token
  namespace: outpost-032-020-03-02
  annotations:
    kubernetes.io/service-account.name: ledger
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: archive-credentials
  namespace: outpost-032-020-03-02
  annotations:
    kubernetes.io/service-account.name: archive
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: ledger-settings
  namespace: outpost-032-020-03-02
type: Opaque
stringData:
  currency: credits
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger-client
  namespace: outpost-032-020-03-02
  labels:
    app: ledger-client
spec:
  serviceAccountName: ledger
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "sleep 86400"]
    volumeMounts:
    - name: api-token
      mountPath: /var/run/tokens
      readOnly: true
  volumes:
  - name: api-token
    projected:
      sources:
      - serviceAccountToken:
          expirationSeconds: 86400
          path: token
