apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-020-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: probe-serviceaccount
    description: Deployment probe runs as ServiceAccount probe with no token mounted
    type: file
    source: validation/validate-probe-serviceaccount.sh
    points: 2
  - name: pod-lister-rbac
    description: pod-lister can get Pods in its namespace only and cannot delete them
    type: file
    source: validation/validate-pod-lister-rbac.sh
    points: 1
  - name: pod-lister-pod
    description: Pod pod-lister runs as ServiceAccount pod-lister
    type: file
    source: validation/validate-pod-lister-pod.sh
    points: 1
  - name: default-account-locked
    description: default-pod-access is gone and the default ServiceAccount mounts no token and cannot get Pods
    type: file
    source: validation/validate-default-account-locked.sh
    points: 1
