apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-032-020-02-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-032-020-02-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/busybox:1.37.0
        command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
        ports:
        - name: http
          containerPort: 8080
