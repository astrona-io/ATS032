apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-api
  namespace: starfleet-032-020-01-01
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: no-token-reader
  namespace: starfleet-032-020-01-01
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: scratch
      mountPath: /scratch
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: scratch
    emptyDir: {}
  serviceAccountName: no-api
  automountServiceAccountToken: false
