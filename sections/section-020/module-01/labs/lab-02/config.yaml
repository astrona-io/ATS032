apiVersion: astrona.io/v1
metadata:
  name: ats-032-lab-020-01-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: legacy-secret-removed
    description: No long-lived token Secret for the ServiceAccount reporter is left in the namespace
    type: file
    source: validation/validate-legacy-secret-removed.sh
    points: 1
  - name: projected-ledger-token
    description: The Pod ledger-client holds a projected reporter token for the audience ledger that expires within 600 seconds
    type: file
    source: validation/validate-projected-ledger-token.sh
    points: 2
