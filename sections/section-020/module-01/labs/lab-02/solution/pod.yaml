apiVersion: v1
kind: Pod
metadata:
  name: reporter
  namespace: audience-training
spec:
  serviceAccountName: reporter
  automountServiceAccountToken: false
  containers:
  - name: client
    image: python:3.13-alpine
    command:
    - sleep
    - '36000'
    volumeMounts:
    - name: identity
      mountPath: /identity
      readOnly: true
  volumes:
  - name: identity
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 600
          audience: telemetry.training
